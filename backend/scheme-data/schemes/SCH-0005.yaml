benefits_summary: >
  Capex-linked incentive of 25% over 5 years, turnover-linked incentive over 6 years, or a hybrid,
  per Segment D tables; part of the incentive is tied to employment commitments. Partially
  deterministic: the segment tables (minimum cumulative investment/turnover thresholds) are NOT
  encoded, so no rupee entitlement is computed. Selection is first-come-first-served and separate
  applications are made per product.
