benefits_summary: >
  Credit guarantee (not a grant/subsidy) covering credit facilities Member
  Lending Institutions extend to Micro and Small Enterprises without
  collateral security or third-party guarantees, up to a ceiling of ₹10
  crore per borrower (raised from ₹5 crore, effective for guarantees
  approved on or after 01.04.2025 — Circular No.250/2024-25). Extent of
  guarantee coverage ranges 75%-90% depending on enterprise category and
  credit-facility slab (e.g. Micro Enterprises: 75-85%; Women
  entrepreneurs/MSEs promoted by Agniveers: 90%; SC/ST/PwD/Aspirational
  District/ZED-certified/Transgender entrepreneurs: 85%). This record
  covers Credit Guarantee Scheme-I (CGS-I) only.

