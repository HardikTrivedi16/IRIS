benefits_summary: >
  Credit guarantee (not a grant): 60% guarantee coverage on eligible loans up to Rs. 100 crore for
  plant, machinery and equipment purchase, through member lending institutions. Cover is
  deterministic by scheme terms but subject to lender sanction; this is not a subsidy and IRIS
  promises no sanction.
