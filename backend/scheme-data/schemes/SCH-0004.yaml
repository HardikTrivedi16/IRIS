benefits_summary: >
  For units qualifying under the "Special Large Scale" (Special LSI) track:
  (1) Electricity Duty Exemption "as applicable under PSI 2019"; (2)
  reimbursement of 50% of the employer's Employees' Provident Fund (EPF)
  contribution; (3) a Special Capital Incentive for Plant & Machinery
  investment made for technology upgradation to meet export standards,
  reimbursed at 30% of the investment or Rs. 1 crore, whichever is lower.
  CORRECTION TO EARLIER RESEARCH: the "1-2% of incremental export turnover"
  cash incentive documented elsewhere in this policy is specific to the
  separate MSME track (Annexure VI) — the archived evidence for the
  Special-LSI track (Annexure X + XX, p.43/56-57) shows this different
  benefit basket, not a percentage-of-export-turnover incentive. See review
  pack.

