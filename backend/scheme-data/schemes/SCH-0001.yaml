benefits_summary: >
  Certification-cost subsidy on ZED Bronze/Silver/Gold certification: Micro
  80%, Small 60%, Medium 50% of certification cost. Additional subsidy of
  10% for MSMEs owned by Women/SC/ST entrepreneurs, or MSMEs in NER/
  Himalayan/LWE/Island territories/aspirational districts; a further
  additional 5% for MSMEs also part of SFURTI or the MSE-Cluster
  Development Programme (MSE-CDP). A one-time, limited-purpose joining
  reward of Rs. 10,000 is offered to each MSME on taking the ZED Pledge,
  usable only once toward a ZED Certification application.

