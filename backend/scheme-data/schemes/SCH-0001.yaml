benefits_summary: >
  Subsidy on the cost of ZED certification (Bronze/Silver/Gold): Micro 80%, Small 60%, Medium 50%.
  Per the Ministry addendum effective 11.11.2023 (SRC-SCH-005 addendum), MSMEs owned by women
  entrepreneurs get a 100% subsidy (the additional 10%/5% tiers do not apply to them); an additional
  10% applies to MSMEs owned by SC/ST entrepreneurs or located in NER/Himalayan/LWE/Island
  territories/aspirational districts, and a further 5% to MSMEs that are also part of SFURTI or
  MSE-CDP (other than women-owned). A one-time Rs. 10,000 joining reward is offered on taking the
  ZED Pledge. Rates are stated for orientation only; IRIS computes no entitlement.

