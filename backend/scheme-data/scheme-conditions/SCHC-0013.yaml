source_reference:
  document_title: "Maharashtra Electric Vehicle Policy 2025 - Transport Department GR dated 23.05.2025 (supply-side clause)"
  clause: "Supply-side clause: EV, EV-battery and EV-component manufacturers, including MSMEs"
  page_number: null
  quoted_text: null   # PENDING ARCHIVAL - the official artifact has not been archived/read in this repository; clause text and page are to be pinned by the archiving human.
description: >
  Project's EV value-chain role is a manufacturing role (VEHICLE_OEM, COMPONENT_MFR,
  BATTERY_PACK_ASSEMBLER or ACC_CELL_MFR). Charging-infrastructure providers and projects with no
  EV role are outside this supply-side pathway.
normalization_notes: >
  Research F-23 (project.ev_value_chain_role, ENUM {VEHICLE_OEM, COMPONENT_MFR,
  BATTERY_PACK_ASSEMBLER, ACC_CELL_MFR, CHARGING_INFRA, NONE}). The evaluator has no IN operator,
  so the manufacturing set is expressed as NOT_IN over the two non-manufacturing values of that
  exhaustive ENUM (same technique as SCHC-0004/0007). Research pack
  MH_MULTI_SECTOR_SCHEME_RESEARCH.md (sections 13 F-23, 14 MH-04) is the only basis for this
  condition; the underlying official artifact is not yet archived, so the clause and quoted text
  are unpinned and the record stays DRAFT.
