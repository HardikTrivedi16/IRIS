rule_version_id: RULE-0001-V2
rule_id: RULE-0001
version_number: 2

condition_expression_root_id: COND-0070
logic: "COND-0070 = AND(likely_to_discharge_sewage_or_trade_effluent==true, is_white_category_industrial_plant==false, holds_prior_environmental_clearance==false)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - prior consent of the State Board under Water Act, 1974,
  s.25(1)(a) is required before establishing (or taking steps to establish) the
  industry/operation/process, treatment/disposal system, or extension/addition
  to one: discharge is likely and neither the White-category exemption nor the
  prior-EC exemption of G.S.R. 703(E) (12.11.2024) applies.

false_outcome: >
  NOT_APPLICABLE on this trigger - the project is not likely to discharge
  sewage or trade effluent, OR it is a White-category plant (pollution index
  score up to 20, exempt from s.25(1) on written intimation to the State Board),
  OR it holds prior environmental clearance in respect of consent to establish
  (G.S.R. 703(E)(b)). This does not evaluate any other consent (including
  consent to operate, or MPCB's self-certified consent handling of White
  category units) that might independently apply.

unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine applicability until the project's
  discharge characteristics, White-category status and prior-EC status are
  known (a fact that is enough to establish an exemption resolves the result
  without the others).


required_project_facts:
  - project.likely_to_discharge_sewage_or_trade_effluent
  - project.is_white_category_industrial_plant
  - project.holds_prior_environmental_clearance

