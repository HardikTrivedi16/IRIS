validation_notes: >
  Wave 1C (2026-09-26) corrected successor to RULE-0001-V1, which is
  PRESERVED UNEDITED as the pre-2024-exemption logic (still DRAFT: no
  transition date is set on it because the Maharashtra transition is not
  established). Legal change: G.S.R. 703(E) of 12.11.2024 (SRC-018) exempts
  White-category plants and prior-EC plants from s.25(1).

  STILL DRAFT / NOT ACTIVE, and effective_start_date is deliberately null.
  Open items for the human reviewer: (1) the Central proviso under which
  G.S.R. 703(E) was issued was substituted by the Water Amendment Act, 2024,
  which by its own s.1(2)-(3) applies in a State other than Himachal Pradesh,
  Rajasthan and the UTs only on adoption by that State's resolution;
  Maharashtra's adoption is reported in secondary sources only and no official
  adoption instrument (with its date) is archived, so the 2024-11-12 candidate
  transition date is NOT asserted for Maharashtra; (2) MPCB's circular of
  16.06.2025 (SRC-023) says White-category consents are granted on
  self-certification via its portal, so 'NOT_APPLICABLE' for a White plant
  means exempt from the s.25(1) consent-to-establish requirement, not that no
  MPCB portal step exists; (3) the White-category exemption is conditional on
  written intimation to the State Board, which is not modelled; (4) the
  Schedule (pollution index <= 20) and MPCB's additional 222 listed
  activities are not encoded - is_white_category_industrial_plant is a
  human-supplied fact; (5) the MoEFCC SOP of 14.11.2024 (SRC-020, scanned)
  says prior-EC projects have CTE conditions integrated into the EC. No
  Project Fact for either new key exists in the showcase data yet, so until
  supplied the result is REQUIRES_INFORMATION for projects that may discharge.
  No human VER exists; cannot be promoted to ACTIVE until reviewed.

