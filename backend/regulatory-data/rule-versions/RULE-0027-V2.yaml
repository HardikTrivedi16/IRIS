rule_version_id: RULE-0027-V2
rule_id: RULE-0027
version_number: 2

condition_expression_root_id: COND-0081
logic: "COND-0081 = AND(manufactures_schedule1_eee==true, msme_classification NOT_IN [MICRO])"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - the project is a "manufacturer" of Schedule-I EEE (E-Waste Rules 2022
  r.3(1)(p): has facilities for manufacture of Schedule-I EEE) and is not a micro
  enterprise: it must register on the CPCB portal as a manufacturer (r.4(1)(a)),
  separately from any producer registration (r.4(2)).

false_outcome: >
  NOT_APPLICABLE on this trigger - the project does not manufacture Schedule-I EEE,
  OR it is a micro enterprise, to which the Rules do not apply (r.2(c)).

unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine until manufactures_schedule1_eee and the
  MSME classification are known.


required_project_facts:
  - project.manufactures_schedule1_eee
  - project.msme_classification

