validation_notes: >
  Batch 2 (2026-09-26) corrected successor to RULE-0027-V1, which ignored r.2(c)
  (Rules do not apply to micro enterprises). RULE-0027-V1 is preserved as SUPERSEDED
  (no dates: an incomplete encoding). REQ-0018 (producer) and REQ-0019 (manufacturer)
  remain distinct Requirements: r.4(1) lists 'manufacturer' and 'producer' as separate
  registration categories and r.4(2) requires separate registrations where an entity is
  both. 'Contract manufacture' is not a term in the Rules; a contract manufacturer is a
  'manufacturer' if it has facilities to manufacture Schedule-I EEE. Not encoded: which
  items are Schedule-I EEE (human-supplied), other duties. No human VER exists.
  Currentness sweep (2026-09-26): CLEARED on the same basis as RULE-0026-V2 (no E-Waste amendment after
  G.S.R. 164(E), 08.03.2024 located).

