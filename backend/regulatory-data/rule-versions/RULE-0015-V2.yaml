rule_version_id: RULE-0015-V2
rule_id: RULE-0015
version_number: 2

condition_expression_root_id: COND-0043
logic: "COND-0043 = AND(annual_turnover_inr>15000000, annual_turnover_inr<=500000000, food_subsector NOT_IN [DAIRY,VEGETABLE_OIL,SLAUGHTER,MEAT_PROCESSING,GRAIN_CEREAL_PULSE_MILLING])"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — a State FSSAI licence is required (residual/general-
  manufacturing category, annual turnover above Rs. 1.5 crore and up to
  Rs. 50 crore), effective 01.04.2026 per FSSAI Order dated 13.03.2026.
false_outcome: >
  NOT_APPLICABLE on this trigger — either annual turnover is Rs. 1.5
  crore or less (see RULE-0016-V1/Registration) or more than Rs. 50 crore
  (see RULE-0014-V2/Central), or the project's food subsector is dairy/
  vegetable-oil/slaughter/meat/milling.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine State-licence applicability
  until annual turnover and food subsector are known.

required_project_facts:
  - project.annual_turnover_inr
  - project.food_subsector

