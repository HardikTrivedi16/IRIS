rule_version_id: RULE-0013-V2
rule_id: RULE-0013
version_number: 2

condition_expression_root_id: COND-0076
logic: "COND-0076 = AND(generates_or_handles_scheduled_hazardous_waste==true, OR(state_board_consent_not_required_under_water_and_air_acts==false, hands_over_hazardous_waste_to_authorised_actual_user_collector_or_disposal_facility==false))"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - a Form 2 hazardous-waste authorisation (5-year validity) is
  required (HOWM Rules, 2016, r.6(1)-(2)) because the project generates or
  handles Schedule-listed waste and the Rule 6(1A) exemption is not
  established (consent under the Water/Air Acts is required, or the waste is not
  handed to an authorised destination); Form 4 annual return by 30 June,
  renewal 3 months prior to expiry.

false_outcome: >
  NOT_APPLICABLE on this trigger - either the project does not generate or
  handle Schedule-listed waste, OR Rule 6(1A) applies: consent to establish and
  consent to operate are not required from the State Board under the Water and
  Air Acts AND the waste is given to the actual user, waste collector or
  disposal-facility operator per CPCB guidelines.

unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine authorisation applicability until
  the waste trigger and, where the waste trigger is met, the consent status and
  the handover of the waste are known.


required_project_facts:
  - project.generates_or_handles_scheduled_hazardous_waste
  - project.state_board_consent_not_required_under_water_and_air_acts
  - project.hands_over_hazardous_waste_to_authorised_actual_user_collector_or_disposal_facility

