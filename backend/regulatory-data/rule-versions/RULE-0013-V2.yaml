validation_notes: >
  Wave 1C (2026-09-26) corrected successor to RULE-0013-V1 (over-inclusive:
  it ignored Rule 6(1A)). Legal change: the HOWM (M&TM) Amendment Rules, 2019,
  G.S.R. 178(E) (SRC-024, Gazette dated 5 March 2019, in force on publication)
  inserted r.6(1A). RULE-0013-V1 is preserved as status SUPERSEDED with
  effective_end_date 2019-03-04 (the day before this successor). Per SRC-025
  (Ninth Amendment, 2024) read with the CPCB-listed amendments, only these two
  amendments were found to change Rule 6; the Ninth Amendment's r.6(1B)-(1C)
  concern domestic-waste deposition centres and are not modelled.

  No EC-holder exemption is invented: a prior-EC holder has consent to
  operate still required, so the Rule 6(1A) fact would not be TRUE on that
  basis alone. Interpretation to confirm: 'the consent ... is not required ...
  under the Water Act and Air Act' is encoded conservatively as consent not
  required under EITHER Act, for both consent to establish and consent to
  operate (state_board_consent_not_required_under_water_and_air_acts). Both
  exemption facts are human-supplied booleans; the CPCB guidelines on handover
  are not archived or modelled. DEMO IMPACT: no showcase project carries the
  two new facts yet, so waste-generating projects that previously evaluated
  APPLICABLE now evaluate REQUIRES_INFORMATION until the facts are supplied
  (fail-safe). No human VER exists; cannot be promoted to ACTIVE.
  Batch 2 (2026-09-26) Rule 6(1A) proviso check: no CPCB guideline expressly issued for the Rule 6(1A)
  proviso ('in accordance with the Central Pollution Control Board guidelines') was found on the CPCB
  hazardous-waste 'Technical Guidelines' or 'Important Communication' pages (the guideline list there was
  read); the operative handover duties are in the Rules themselves (r.4 occupier responsibilities, r.6(8)
  passbook entry, transport rules - SRC-010). The boolean handover fact is therefore defined as the
  occupier's attested handover to an authorised actual user / waste collector / disposal-facility operator
  'in accordance with CPCB guidelines'; IRIS cannot verify guideline compliance and adds no extra condition.
  This is disclosed for the reviewer, not resolved.
  Currentness/guideline sweep (2026-09-26): (A) no CPCB guideline specific to the r.6(1A) proviso could be
  retrieved after a further official-source search - the proviso refers generically to 'the Central Pollution
  Control Board guidelines' and creates no separate applicability condition beyond the handover itself (B); the
  handover boolean is safe as an occupier attestation for this Requirement, with guideline compliance outside
  its scope. (C) Later HOWM amendments - 14.08.2024 and G.S.R. 438(E) of 01.07.2025 - are described by
  Government sources (PIB, MoEFCC annual report) as inserting EPR for scrap of non-ferrous metals (new
  Chapter VIII); their Gazette text was NOT retrieved, so 'no change to r.6/6(1A)' rests on those official
  descriptions plus CPCB's rules page (which lists no 2025 amendment). Residual disclosed for the reviewer.

