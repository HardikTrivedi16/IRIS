validation_notes: >
  Successor to RULE-0014-V1 (installed-capacity ">2 MT/day" test), per
  rule_review_register.yaml RULE-REV-0006: an FSSAI Order dated
  13.03.2026 (SRC-011), corroborated by FSSAI's own live FoSCoS
  eligibility table (SRC-012), supersedes the turnover/eligibility
  criteria for this category with a pure turnover scheme effective
  01.04.2026. RULE-0014-V1 was NOT deleted or edited in place — it is
  preserved as status: SUPERSEDED with effective_end_date "2026-03-31"
  (the day before this successor's effective_start_date),
  the repository's existing lifecycle mechanism for exactly this case
  (see iris_engine/validate.py's ACTIVE-promotion-gate docstring on
  "Historical knowledge belongs on a SUPERSEDED/RETIRED Rule Version").

  STILL DRAFT, STILL BLOCKED FROM ACTIVE: this Rule Version was authored
  from genuinely archived official material (SRC-011, SRC-012), but (1)
  the underlying 10.03.2026 gazette notification text itself could not be
  retrieved (dead link — see SRC-011 notes), so it is not established
  whether Schedule 1's own text was textually amended versus superseded
  in practice by a delegated order; and (2) no human has verified this
  Rule Version yet — no APPROVED VER record exists. Cannot be promoted to
  ACTIVE until both are resolved by a human reviewer.

  SCOPE CAVEAT (not resolved here): SRC-012's table lists "Fish and Fish
  products" as its own separate category with its own thresholds,
  distinct from "General manufacturing" — a split that did not exist
  under the historical Schedule 1 text (fish fell under entry V's
  residual bucket). This dataset has no food_subsector enum value for
  fish, so a fish-processing project would still (arguably incorrectly,
  post-2026) evaluate through this general-manufacturing rule rather than
  a fish-specific one. Flagged, not fixed — no evidence was collected for
  a fish-specific threshold, and inventing a food_subsector value without
  it would be exactly the kind of fabrication this dataset must avoid.

  BATCH 2 FINAL PASS (2026-09-26) - scope semantics corrected on this uncommitted successor of RULE-0014-V2.
  The turnover bands and the 01.04.2026 date are UNCHANGED. Two changes: (1) INDUSTRY GATE:
  project.industry == FOOD (existing COND-0004, canonical fact) is now required, so a non-FOOD project
  gets NOT_APPLICABLE instead of a request for FSSAI facts; industry==FOOD is an IRIS proxy for "food
  business" (see RULE-0004 confidence note) and is human-supplied. (2) SUBSECTOR PARTITION from SRC-012
  (updated 01.04.2026): A) SAME three turnover bands, therefore classified by turnover with no exclusion:
  general manufacturing, dairy, vegetable oil, slaughtering, meat processing, fish and fish products,
  substances added to food; B) DIFFERENT rule, encoded exactly as SRC-012 states it: always-Central
  regardless of turnover - food/health supplements and nutraceuticals, Ayurveda Aahara, proprietary
  food, non-specified food, radiation processing, 100% export-oriented units/exporter-manufacturers;
  State regardless of turnover - grain/cereal/pulse milling units; C) not sufficiently encoded and
  documented as limits: the dairy note that petty milkmen/milk vendors take Registration, the
  100%-EOU condition (EOU certificate AND products not meeting FSSAI standards - the subsector is
  human-supplied), the Hawker/Petty-retailer/other non-manufacturing rows, and product-approval
  prerequisites for non-specified food. No threshold is invented. Currentness grounding: SRC-011 is
  FSSAI's own signed Order of 13.03.2026 (superseding earlier turnover thresholds/criteria, effective
  01.04.2026), SRC-012 applies the same bands; the 10.03.2026 Gazette text is still NOT archived - see
  RULE-REV-0012. Still DRAFT; no human VER exists.
  Provenance correction (approval pass, 2026-09-26): RF-0013 (the historical Schedule-1 dairy/entry-V
  mutual-exclusivity statement) is no longer cited by this Rule Version because the final model does not
  use the five-subsector guard COND-0032. It remains on the superseded predecessors.

