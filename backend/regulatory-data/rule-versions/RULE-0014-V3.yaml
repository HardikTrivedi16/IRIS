rule_version_id: RULE-0014-V3
rule_id: RULE-0014
version_number: 3

condition_expression_root_id: COND-0083
logic: "COND-0083 = AND(industry==FOOD, OR(AND(annual_turnover_inr>500000000, food_subsector NOT_IN [HEALTH_SUPPLEMENT_NUTRACEUTICAL,AYURVEDA_AAHARA,PROPRIETARY_FOOD,NON_SPECIFIED_FOOD,RADIATION_PROCESSING,EXPORT_ORIENTED_OR_EXPORTER_MANUFACTURER,GRAIN_CEREAL_PULSE_MILLING]), food_subsector IN [HEALTH_SUPPLEMENT_NUTRACEUTICAL,AYURVEDA_AAHARA,PROPRIETARY_FOOD,NON_SPECIFIED_FOOD,RADIATION_PROCESSING,EXPORT_ORIENTED_OR_EXPORTER_MANUFACTURER]))"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - a Central FSSAI licence is required for this food business:
  either annual turnover is more than Rs. 50 crore (standard bands,
  effective 01.04.2026 per FSSAI Order dated 13.03.2026), or the business is
  one of the always-Central categories in the FoSCoS eligibility table
  (food/health supplements and nutraceuticals, Ayurveda Aahara, proprietary
  food, non-specified food, radiation processing, 100% export-oriented
  units/exporter-manufacturers - "no restriction on turnover threshold").
false_outcome: >
  NOT_APPLICABLE - the project is not a FOOD-industry project, or it is a
  food business whose tier is State or Registration: annual turnover is Rs.
  50 crore or less (see RULE-0015-V3/State or RULE-0016-V2/Registration) and
  it is not an always-Central category, or it is a grain/cereal/pulse
  milling unit (State licence, see RULE-0015-V3). This is a Central-tier
  conclusion only: it never means that no FSSAI licence or registration
  applies.
unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine the Central tier until industry,
  annual turnover and food subsector are known (an always-Central subsector,
  or a non-FOOD industry, resolves the result without turnover).

required_project_facts:
  - project.industry
  - project.annual_turnover_inr
  - project.food_subsector

