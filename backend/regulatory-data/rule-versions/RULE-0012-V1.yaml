rule_version_id: RULE-0012-V1
rule_id: RULE-0012
version_number: 1

condition_expression_root_id: COND-0029
logic: "COND-0029 = (prepacks_commodities_for_retail_sale == true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — manufacturer/packer registration under LM(PC) Rules, 2011,
  r.27(1) is required within 90 days of commencing pre-packing (fee ₹500).
false_outcome: >
  NOT_APPLICABLE — the project does not pre-pack commodities for retail
  sale on current information.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine registration applicability until
  whether the project pre-packs commodities for retail sale is known.

required_project_facts:
  - project.prepacks_commodities_for_retail_sale

regulatory_fact_ids:
