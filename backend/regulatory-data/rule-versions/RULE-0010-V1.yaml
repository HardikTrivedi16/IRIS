validation_notes: >
  Per the research pack: "renewal calendar must model event-based lapse,
  not dates alone." This Rule Version models the gate (does the continuing
  obligation attach at all) deterministically; it does not attempt to
  compute a renewal due-date or detect the individual cessation events
  (accident/movement/structural alteration/prohibition order) from Project
  Facts — those remain descriptive in true_outcome pending a dedicated
  event/date-tracking mechanism, which this pass does not build. Cannot be
  promoted to ACTIVE without archived SRC-007 + a human VER record.
  Wave 1C (2026-09-26) commencement check: S.O. 1943(E) dated 30.04.2025
  (SRC-028, Gazette of India Extraordinary No. 1900, archived from DPIIT)
  appoints 1st May, 2025 as the date on which the provisions of the Boilers
  Act, 2025 come into force (all provisions, no section-wise dates), so
  effective_start_date is 2025-05-01. This closes the commencement gap only:
  the Rule Version remains DRAFT, no human VER exists, and the limitations
  above are unchanged.

approval_note: >
  Promoted to ACTIVE on 2026-09-26 after human approval (Hardik Trivedi, VER-0002) for the encoded scope; see the APPROVED VER record for this
  Rule Version. All documented limitations in this file's notes remain in force.
