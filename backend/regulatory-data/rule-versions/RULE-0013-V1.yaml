validation_notes: >
  Boolean trigger verbatim from r.6(1) — never inferred from sector (a DG
  set's used oil is Schedule-listed even for a plant with no other
  hazardous process; the fact must be captured honestly, not assumed).
  Cannot be promoted to ACTIVE without archived SRC-010 + a human VER
  record.

superseded_note: >
  Wave 1C (2026-09-26): superseded by RULE-0013-V2 as of the Rule 6(1A)
  insertion (HOWM Amendment Rules 2019, Gazette dated 5 March 2019, in force on
  publication - SRC-024). This version reflects the rule text without the
  6(1A) exemption; preserved unedited apart from status, end date and this note.
