rule_version_id: RULE-0013-V1
rule_id: RULE-0013
version_number: 1

condition_expression_root_id: COND-0030
logic: "COND-0030 = (generates_or_handles_scheduled_hazardous_waste == true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — a Form 2 hazardous-waste authorisation (5-year validity) is
  required (HOWM Rules, 2016, r.6(1)-(2)); Form 4 annual return by 30 June,
  renewal 3 months prior to expiry.
false_outcome: >
  NOT_APPLICABLE on this trigger — the project does not, on current
  information, generate or handle Schedule-listed hazardous or other
  waste.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine authorisation applicability
  until whether the project generates/handles Schedule-listed hazardous
  waste is known.

required_project_facts:
  - project.generates_or_handles_scheduled_hazardous_waste

regulatory_fact_ids:
