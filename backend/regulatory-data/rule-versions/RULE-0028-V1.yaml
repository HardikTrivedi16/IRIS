condition_expression_root_id: COND-0066
logic: "COND-0066 = (msihc_schedule3_chemical_at_or_above_threshold==true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - occupier must submit a written site notification (Schedule 7 particulars) at least 3 months before commencing the industrial activity (MSIHC Rules r.7(1)).
false_outcome: >
  NOT_APPLICABLE - no Schedule-3 chemical is at or above its threshold quantity.
unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine until the Schedule-3 threshold worksheet result is known.

required_project_facts:
  - project.msihc_schedule3_chemical_at_or_above_threshold

