validation_notes: >
  New Rule (2026-09-23), aggregated under REQ-0003 via
  `classification_rule_ids` alongside RULE-0018 (PH-02) and RULE-0019
  (PH-03) — see rule_review_register.yaml RULE-REV-0002.

  WHY THIS IS A NEW RULE RATHER THAN RULE-0003 ITSELF: the normalized
  research literally describes PH-01 as "existing REQ-0003/RULE-0003
  with corrected ENUM." Tracing iris_engine.classification and
  iris_engine.decision precisely (not assumed) shows this literal
  reading would silently break for Schedule C/C(1) or Schedule X
  products: `evaluate_classification_group`'s combine result is only
  promoted to the Requirement's top-level `final_state` when
  `evaluated_by_rule_id`'s OWN rv_eval.final_state is already
  "APPLICABLE" (`decision.py`'s `base_applies` check). If RULE-0003
  itself tested `drug_schedule_classification==NONE` directly, then for
  a Schedule-C/C1 product RULE-0003 would resolve FALSE, `base_applies`
  would be False, and PH-02's correct "APPLICABLE" result would never
  reach REQ-0003's top-level Decision — silently wrong. Splitting the
  schedule-independent coarse gate (RULE-0003) from the schedule-specific
  branches (this Rule, RULE-0018, RULE-0019) makes the SAME mechanism
  that already works correctly for REQ-0004/dairy (and for the new PH-04)
  work correctly here too: the coarse gate is a genuine superset
  condition of each classification branch, so `base_applies` is True
  whenever any branch COULD fire, and the classification result is
  faithfully promoted. Verified end-to-end in
  tests_engine_baseline/test_pharma_tranche.py.
