rule_version_id: RULE-0017-V1
rule_id: RULE-0017
version_number: 1

condition_expression_root_id: COND-0049
logic: "COND-0049 = AND(COND-0003, drug_schedule_classification==NONE)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — the Rule 69(1)(c) licence-application pathway applies: an
  application for grant of a licence to manufacture the drug(s) for
  sale/distribution is made to the State Licensing Authority (FDA Maharashtra)
  in Form 24 (Rule 69(1)(c), 'any other case'); the licence is issued in
  Form 25. There is no renewal application: 'or renewal' was omitted by G.S.R.
  1337(E) of 27.10.2017 and licence duration is governed by the retention fee
  (REQ-0015).
false_outcome: >
  NOT_APPLICABLE on this pathway — either the coarse drug-manufacturing
  gate does not clear (RULE-0003), or the drug schedule classification is
  not NONE (see RULE-0018/PH-02 for Schedule C/C(1), or RULE-0019/PH-03
  for Schedule-X-related products).
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine this pathway's applicability
  until manufactures_drugs_for_sale_or_distribution, pharma_activity_type,
  and drug_schedule_classification are known.

required_project_facts:
  - project.manufactures_drugs_for_sale_or_distribution
  - project.pharma_activity_type
  - project.drug_schedule_classification

