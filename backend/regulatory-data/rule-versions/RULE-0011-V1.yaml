validation_notes: >
  Never infers msme_classification from project size/scale — it is a
  distinct, user-declared statutory fact. KNOWN LIMITATION, preserved as
  specified rather than silently corrected (see COND-0028's own
  normalization_notes): this composite can resolve APPLICABLE for a
  project with zero groundwater abstraction, purely on the
  not-Micro/Small branch — flagged for human review, implemented exactly
  as the research pack's own predicate formula (item 7 of the
  implementation brief: "use the exact representable research logic").
  Cannot be promoted to ACTIVE without archived SRC-008 + a human VER
  record.
