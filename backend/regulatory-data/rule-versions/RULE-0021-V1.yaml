rule_version_id: RULE-0021-V1
rule_id: RULE-0021
version_number: 1

condition_expression_root_id: COND-0058
logic: "COND-0058 = AND(COND-0056, located_in_notified_industrial_area==false)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — Environmental Clearance under EIA 2006 Schedule item 5(f)
  applies, Category A (outside a notified industrial area/estate):
  appraised by MoEFCC.
false_outcome: >
  NOT_APPLICABLE on this Category-A route — either the coarse gate does
  not clear (RULE-0020), or the project IS located in a notified
  industrial area/estate (see RULE-0022, Category B).
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine Category-A applicability until
  pharma_activity_type and located_in_notified_industrial_area are known.

required_project_facts:
  - project.pharma_activity_type
  - project.located_in_notified_industrial_area

