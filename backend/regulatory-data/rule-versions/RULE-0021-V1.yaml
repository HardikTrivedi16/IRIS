validation_notes: >
  New Rule (2026-09-23). KEEP_DRAFT per the normalized research H2.2 —
  "RF blocked: Consolidated 5(f) text (2006 + S.O. 1599(E) 2014 +
  S.O. 1223(E) 2020) not assembled — the B/B2 sub-route outcome depends
  on it (H5 #6)." No Regulatory Fact/Evidence/Source authored this pass
  — fields deliberately empty, not fabricated.

  ENGINEERING NOTE: aggregated under REQ-0014 via `classification_rule_ids`
  alongside RULE-0022 (Category B), with REQ-0014.evaluated_by_rule_id
  pointing at RULE-0020 (the coarse gate, activity-only, COND-0056) —
  see REQ-0014's validation_notes. This coarse-gate/classification split
  is required for the same reason RULE-0017/0018/0019 needed it under
  REQ-0003 (see RULE-0017's validation_notes) — a general property of
  `iris_engine.classification`'s combine logic, not Pharma-specific.
