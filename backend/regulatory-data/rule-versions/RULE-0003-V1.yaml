rule_version_id: RULE-0003-V1
rule_id: RULE-0003
version_number: 1

condition_expression_root_id: COND-0003
logic: "COND-0003 = AND(manufactures_drugs_for_sale_or_distribution==true, pharma_activity_type NOT_IN [REPACKING])"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — some drug-manufacturing-licence pathway applies to this
  project. Which specific pathway (Form 24/25, Form 27/28, or a
  Schedule-X-related form pair) depends on the drug schedule
  classification — see RULE-0017 (PH-01), RULE-0018 (PH-02), and
  RULE-0019 (PH-03), evaluated as this Requirement's classification
  members.
false_outcome: >
  NOT_APPLICABLE — either the project does not manufacture drugs for
  sale/distribution, or its pharma activity is REPACKING (which has its
  own separate Form 24-B/25-B pathway, not modelled this pass).
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine whether any drug-manufacturing-
  licence pathway applies until manufactures_drugs_for_sale_or_distribution
  and pharma_activity_type are known.

required_project_facts:
  - project.manufactures_drugs_for_sale_or_distribution
  - project.pharma_activity_type

regulatory_fact_ids:
  - RF-0025
evidence_ids:
  - EVID-DRUGS-01
source_ids:
  - SRC-013
authority_id: AUTH-FDA-MH
instrument_id: INST-DRUGS-RULES-1945

jurisdiction: MAHARASHTRA
lifecycle_stage: PRE_OPERATION

effective_start_date: null
effective_end_date: null

status: DRAFT
confidence: VERIFIED

supersedes_rule_version_id: null
prerequisite_requirement_ids: []
exception_ids: []

priority: 1

