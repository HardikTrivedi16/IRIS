validation_notes: >
  CORRECTED 2026-09-23 (normalized-research H1; see
  rule_review_register.yaml RULE-REV-0002). Previously this Rule Version
  directly tested `drug_schedule_classification NOT_IN
  ["SCHEDULE_C","SCHEDULE_C1","SCHEDULE_X"]` with a FALSE branch mapped
  to REQUIRES_REVIEW (no evidence existed for what governs the excluded
  schedules). That gap is now filled by RULE-0017/0018/0019 (PH-01/02/
  03), so this Rule Version was repurposed to the coarse gate those three
  Rules all sit above (see COND-0003's own normalization_notes for the
  exact engine-mechanics reasoning: `classification_rule_ids` can only
  correctly promote a classification result to REQ-0003's top-level
  Decision when this gate itself is already APPLICABLE). Never ACTIVE,
  still DRAFT — this is a genuine in-place correction of an
  never-authoritative model, not a change to settled historical legal
  meaning; nothing here contradicts the prior version's own evidence,
  which is superseded in shape only, not in substance. The former
  RF-0004/0005/0006/0007 and EVID-FDA-01/SRC-005/INST-DRUG-45 references
  were pre-existing dangling stubs (those files were never created in
  this repository) — left as-is elsewhere (e.g. REQ-0003's own
  grounding_regulatory_fact_ids), not fabricated into real records by
  this pass.
