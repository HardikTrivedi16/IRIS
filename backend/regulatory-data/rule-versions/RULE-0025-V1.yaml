logic: "COND-0063 = (places_batteries_on_market==true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - producer registration with CPCB (Form 1(A), centralised portal) plus EPR collection/recycling obligations under BWM Rules 2022 r.4(1).
false_outcome: >
  NOT_APPLICABLE - the project does not place batteries on the market (e.g. a pure contract assembler).
unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine until places_batteries_on_market is known.

required_project_facts:
  - project.places_batteries_on_market

