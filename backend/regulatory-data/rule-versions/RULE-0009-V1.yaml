validation_notes: >
  Retires any prior reference to the repealed Boilers Act, 1923 — this Rule
  cites only the Boilers Act, 2025 (in force 01.05.2025). Unit discipline:
  litres and kg/cm² only, never TPH (an evaporation rate, not the statutory
  volumetric measure) or bar. Boundary discipline: inclusion test is ">= 25"
  / ">= 1", never "> 25" / "> 1" — the statute excludes strictly "< 25 L" /
  "< 1 kg/cm²". LIMITATION, stated explicitly and not to be silently
  presented as complete: this two-fact condition does not represent the
  Act's third exclusion leg (water heated below 100°C, s.2(c)(iii)) — no
  Project Fact for temperature exists in this dataset. Cannot be promoted
  to ACTIVE without archived SRC-007 + a human VER record.
