rule_version_id: RULE-0009-V1
rule_id: RULE-0009
version_number: 1

condition_expression_root_id: COND-0024
logic: "COND-0024 = AND(boiler_volumetric_capacity_litres>=25, boiler_design_gauge_pressure_kg_cm2>=1)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — the vessel is a "boiler" under the Boilers Act, 2025, s.2(c);
  registration (s.12) and a certificate (renewal duties: see REQ-0007/SH-05)
  are required before use (s.11(1)).
false_outcome: >
  NOT_APPLICABLE — the vessel's stated capacity/pressure falls outside the
  statutory definition on the two Project Facts this dataset captures. This
  does NOT independently evaluate the Act's third exclusion (water heated
  below 100°C), for which no Project Fact exists — see validation_notes.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine boiler-registration applicability
  until volumetric capacity and design/working gauge pressure are known.

required_project_facts:
  - project.boiler_volumetric_capacity_litres
  - project.boiler_design_gauge_pressure_kg_cm2

