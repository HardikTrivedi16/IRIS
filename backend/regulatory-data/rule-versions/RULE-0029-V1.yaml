logic: "COND-0067 = (msihc_schedule3_chemical_at_or_above_threshold==true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - occupier must prepare and keep up to date an on-site emergency plan (Schedule 11 details) before commencing (MSIHC Rules r.13).
false_outcome: >
  NOT_APPLICABLE - no Schedule-3 chemical is at or above its threshold quantity.
unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine until the Schedule-3 threshold worksheet result is known.

