rule_version_id: RULE-0012-V2
rule_id: RULE-0012
version_number: 2

condition_expression_root_id: COND-0072
logic: "COND-0072 = (prepacks_or_imports_commodities_for_sale_distribution_or_delivery == true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - registration as manufacturer/packer/importer under LM(PC)
  Rules, 2011, r.27(1) is required within 90 days of commencing pre-packing or
  importing (fee Rs. 500).

false_outcome: >
  NOT_APPLICABLE - the project neither pre-packs nor imports any commodity for
  sale, distribution or delivery on current information.

unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine registration applicability until
  whether the project pre-packs or imports commodities for sale, distribution or
  delivery is known.


required_project_facts:
  - project.prepacks_or_imports_commodities_for_sale_distribution_or_delivery

