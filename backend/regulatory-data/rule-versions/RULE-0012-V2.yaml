validation_notes: >
  Wave 1C (2026-09-26) corrected successor to RULE-0012-V1. V1's fact
  (prepacks_commodities_for_retail_sale) was materially narrower than r.27(1),
  which covers persons who pre-pack OR import any commodity for sale,
  distribution or delivery (no 'retail' limit, and importers). V1 is preserved
  (status SUPERSEDED, no dates: it was an over-narrow encoding, not an earlier
  legal regime). The V1 fact no longer drives the current rule.

  Narrow currentness check (Rule 27 only): SRC-009 (original 2011 text,
  amendments through 2017 read earlier) plus SRC-027, a state-department
  consolidation 'as on 24.12.2024', show the trigger wording unchanged. SRC-027
  is a SECONDARY, non-Gazette compilation and the post-2017 Gazette amendment
  instruments were not individually retrieved - a human reviewer should
  confirm against the Gazette or India Code. Not in scope: exemptions, other
  Rules, and the Legal Metrology Act. No effective_start_date is set. No human
  VER exists; cannot be promoted to ACTIVE until reviewed.
  Batch 2 (2026-09-26) currentness: walked the Department of Consumer Affairs' own official amendment list
  (2017 to the Fourth Amendment Rules of 21.09.2026) and text-searched 22 post-2017 instruments; only G.S.R. 418(E)
  of 29.05.2026 (SRC-030) amends Rule 27, adding sub-rule (2)(d), a sub-rule (3) proviso and sub-rule (5)
  (certificates valid until cancelled). The r.27(1) trigger - 'pre-packs or imports any commodity for sale,
  distribution or delivery' - is unchanged, so RULE-0012-V2 remains aligned. The sub-rule (2)/(3)/(5) additions
  (director name, annual update, validity until cancelled) are not modelled.

approval_note: >
  Promoted to ACTIVE on 2026-09-26 after human approval (Hardik Trivedi, VER-0003) for the encoded scope; see the APPROVED VER record for this
  Rule Version. All documented limitations in this file's notes remain in force.
  effective_start_date basis: Legal Metrology (Packaged Commodities) Rules in force 1 April 2011 (r.1(2), SRC-027 text); the pre-packs-or-imports wording of r.27(1) dates from the original rules.
