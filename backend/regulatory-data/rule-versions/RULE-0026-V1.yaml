condition_expression_root_id: COND-0064
logic: "COND-0064 = (sells_schedule1_eee_under_own_brand==true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - producer of Schedule-I EEE must register on the CPCB EPR e-waste portal and meet EPR recycling targets (Schedules III/IV); no business without registration.
false_outcome: >
  NOT_APPLICABLE - the project does not sell Schedule-I EEE under its own brand.
unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine until sells_schedule1_eee_under_own_brand is known.

required_project_facts:
  - project.sells_schedule1_eee_under_own_brand

