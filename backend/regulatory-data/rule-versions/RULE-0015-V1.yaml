rule_version_id: RULE-0015-V1
rule_id: RULE-0015
version_number: 1

condition_expression_root_id: COND-0035
logic: "COND-0035 = AND(food_processing_installed_capacity_mt_per_day<=2, food_subsector NOT_IN [DAIRY,VEGETABLE_OIL,SLAUGHTER,MEAT_PROCESSING,GRAIN_CEREAL_PULSE_MILLING])"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — a State FSSAI licence is required under Reg. 2.1.2(4)
  (installed capacity 2 MT/day or less, residual food-processing
  subsector).
false_outcome: >
  NOT_APPLICABLE on this trigger — either installed capacity is more than
  2 MT/day (see FD-01/REQ-0011, the Central pathway), or the project's
  food subsector is dairy/vegetable-oil/slaughter/meat/milling.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine State-licence applicability
  until installed capacity and food subsector are known.

required_project_facts:
  - project.food_processing_installed_capacity_mt_per_day
  - project.food_subsector

regulatory_fact_ids:
  - RF-0012
  - RF-0013
