validation_notes: >
  Uses the engine's supported "<=" operator (no "<" was invented). At
  exactly 2.0 MT/day this Rule is TRUE (State) and RULE-0014 (Central) is
  FALSE — the two pathways are exact complements on the capacity dimension,
  never simultaneously TRUE or FALSE for a known, non-boundary-excluded
  capacity value. 2026-amendment watch item (this note's own prediction,
  now confirmed): Reg. 2.1.2(6) lets the Food Authority re-specify
  eligibility/Licensing-Authority by order — exercised via SRC-011's
  Order dated 13.03.2026, corroborated by SRC-012's live FoSCoS table.

  SUPERSEDED (2026-09-23): exactly the re-verification this note warned
  would be needed, not silent continuation. This Rule Version is
  preserved, unedited, as the historically-evidenced capacity-based
  regime (2011-08-05 to 2026-03-31) — see RULE-0015-V2 for the current
  (turnover-based) successor and rule_review_register.yaml RULE-REV-0006
  for the full rationale. Never promoted to ACTIVE; retains its original
  confidence/evidence exactly as authored.
