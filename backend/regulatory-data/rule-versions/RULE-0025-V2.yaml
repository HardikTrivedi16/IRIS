validation_notes: >
  Batch 2 (2026-09-26) successor to RULE-0025-V1. Legal change: S.O. 4669(E) of
  25.10.2023 (SRC-029) added sub-clause (iv) to the Producer definition and made
  registration a duty of every Producer. RULE-0025-V1 (whose false_outcome named a
  'pure contract assembler' as not applicable) is preserved as SUPERSEDED with
  effective_end_date 2023-10-24. Encoded logic is unchanged: the fact
  places_batteries_on_market is defined as true where ANY of sub-clauses (i)-(iv)
  holds (see RF-0029); it therefore covers own-brand, import and contract
  manufacture/assembly for a brand-owner. Not encoded: EPR targets, recycling
  percentages, forms other than Form 1(A), self-use Battery obligations.
  Amendments S.O. 2374(E) (20.06.2024) and S.O. 5210(E) (03.12.2024) were not
  individually retrieved (a search summary says the former substitutes a Table);
  G.S.R. 190(E) (14.03.2024) and the 24.02.2025 amendment do not touch the Producer
  definition or r.4. No human VER exists; cannot be promoted to ACTIVE.
  Currentness sweep (2026-09-26): CLEARED through the 24.02.2025 amendment (CPCB's live rules page;
  SRC-031 secondary amalgamated text). The unretrieved S.O. 2374(E) and S.O. 5210(E) leave the Producer
  definition and r.4(4)-(5) unchanged per SRC-031. Rule 2(2) excludes Battery in military/security and
  space equipment - outside this Requirement's scope. No 2026 amendment found.

approval_note: >
