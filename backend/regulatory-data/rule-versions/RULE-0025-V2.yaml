rule_version_id: RULE-0025-V2
rule_id: RULE-0025
version_number: 2

condition_expression_root_id: COND-0063
logic: "COND-0063 = (places_batteries_on_market==true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - the project is a "Producer" under BWM Rules 2022 r.3(1)(u) as amended
  (own-brand manufacture and sale; own-brand sale of others' Battery; import of Battery
  or equipment containing Battery; or manufacture/assembly of Battery for sale to an
  own-brand Producer) and must obtain CPCB registration in Form 1(A) on the
  centralised portal (r.4(4)) and carries EPR for Battery it introduces on the market.

false_outcome: >
  NOT_APPLICABLE - the project neither manufactures/sells, imports, nor
  manufactures/assembles for a brand-owner any Battery on current information. A
  contract assembler that sells to an own-brand Producer IS within sub-clause (iv)
  since 25.10.2023 and is not NOT_APPLICABLE.

unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine until places_batteries_on_market is
  known.


required_project_facts:
  - project.places_batteries_on_market

