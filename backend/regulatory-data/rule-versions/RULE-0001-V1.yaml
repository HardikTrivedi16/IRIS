rule_version_id: RULE-0001-V1
rule_id: RULE-0001
version_number: 1

condition_expression_root_id: COND-0001
logic: "single condition — no composite expression required"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — prior consent of the State Board under Water Act, 1974, Section 25(1)(a) is
  required before establishing (or taking steps to establish) the industry/operation/process,
  treatment/disposal system, or extension/addition to one.
false_outcome: >
  NOT_APPLICABLE — the project's activity as described is not, on current information, likely to
  discharge sewage or trade effluent into a stream, well, sewer, or on land, so the Section 25(1)(a)
  consent-to-establish trigger evidenced in RF-0001 is not met. This does not evaluate any other
  provision that might independently require MPCB consent.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine applicability until the project's effluent/discharge
  characteristics are known.

required_project_facts:
  - project.likely_to_discharge_sewage_or_trade_effluent

regulatory_fact_ids:
  - RF-0001
evidence_ids:
  - EVID-MPCB-01
source_ids:
  - SRC-001
