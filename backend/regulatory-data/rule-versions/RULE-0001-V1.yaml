effective_end_date: null

status: DRAFT        # per Phase 2 §10/§19: never ACTIVE without a VERIFIED VER record, which has
                      # not been created in this phase
confidence: VERIFIED  # the condition is a direct, non-interpretive restatement of the evidenced
                      # statutory trigger; no invented category or threshold

