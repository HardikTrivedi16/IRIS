validation_notes: >
  This Rule Version answers only the Section 25(1)(a) discharge-likelihood question the evidence
  actually poses. It does not assert that all pharmaceutical or food factories require MPCB Consent
  to Establish, and it does not enumerate what "likely to discharge sewage or trade effluent" means
  beyond the statute's own words. The FALSE branch is a direct negation of the evidenced trigger
  condition, not an invented exemption. Cannot be promoted to ACTIVE without a `VER` record
  (Phase 2 §19 V-7) — no such human-verification step has occurred in Phase 5.
