rule_version_id: RULE-0015-V3
rule_id: RULE-0015
version_number: 3

condition_expression_root_id: COND-0084
logic: "COND-0084 = AND(industry==FOOD, OR(AND(annual_turnover_inr>15000000, annual_turnover_inr<=500000000, food_subsector NOT_IN [HEALTH_SUPPLEMENT_NUTRACEUTICAL,AYURVEDA_AAHARA,PROPRIETARY_FOOD,NON_SPECIFIED_FOOD,RADIATION_PROCESSING,EXPORT_ORIENTED_OR_EXPORTER_MANUFACTURER,GRAIN_CEREAL_PULSE_MILLING]), food_subsector==GRAIN_CEREAL_PULSE_MILLING))"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - a State FSSAI licence is required for this food business:
  either annual turnover is above Rs. 1.5 crore and up to Rs. 50 crore
  (standard bands, effective 01.04.2026 per FSSAI Order dated 13.03.2026),
  or it is a grain/cereal/pulse milling unit (State licence "without any
  limit on turnover threshold" in the FoSCoS eligibility table).
false_outcome: >
  NOT_APPLICABLE - the project is not a FOOD-industry project, or its tier
  is Central or Registration: annual turnover is Rs. 1.5 crore or less (see
  RULE-0016-V2/Registration) or more than Rs. 50 crore (see
  RULE-0014-V3/Central), or it is an always-Central category. This is a
  State-tier conclusion only: it never means that no FSSAI licence or
  registration applies.
unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine the State tier until industry,
  annual turnover and food subsector are known (a milling subsector, or a
  non-FOOD industry, resolves the result without turnover).

required_project_facts:
  - project.industry
  - project.annual_turnover_inr
  - project.food_subsector

