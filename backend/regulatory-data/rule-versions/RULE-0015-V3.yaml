validation_notes: >
  Successor to RULE-0015-V1 (installed-capacity "<=2 MT/day" test), per
  rule_review_register.yaml RULE-REV-0006 — see RULE-0014-V3's own notes
  for the full currentness rationale (same Order, same corroborating
  table, same effective date, same STILL DRAFT / STILL BLOCKED FROM
  ACTIVE reasoning, same Fish-and-Fish-products scope caveat). Bounded
  strictly to ">1.5 crore and <=50 crore" — never treated as "not
  Central" alone, since that would wrongly include the Registration band
  at or below 1.5 crore (see RULE-0016-V2).

  BATCH 2 FINAL PASS (2026-09-26) - scope semantics corrected on this uncommitted successor of RULE-0015-V2.
  The turnover bands and the 01.04.2026 date are UNCHANGED. Two changes: (1) INDUSTRY GATE:
  project.industry == FOOD (existing COND-0004, canonical fact) is now required, so a non-FOOD project
  gets NOT_APPLICABLE instead of a request for FSSAI facts; industry==FOOD is an IRIS proxy for "food
  business" (see RULE-0004 confidence note) and is human-supplied. (2) SUBSECTOR PARTITION from SRC-012
  (updated 01.04.2026): A) SAME three turnover bands, therefore classified by turnover with no exclusion:
  general manufacturing, dairy, vegetable oil, slaughtering, meat processing, fish and fish products,
  substances added to food; B) DIFFERENT rule, encoded exactly as SRC-012 states it: always-Central
  regardless of turnover - food/health supplements and nutraceuticals, Ayurveda Aahara, proprietary
  food, non-specified food, radiation processing, 100% export-oriented units/exporter-manufacturers;
  State regardless of turnover - grain/cereal/pulse milling units; C) not sufficiently encoded and
  documented as limits: the dairy note that petty milkmen/milk vendors take Registration, the
  100%-EOU condition (EOU certificate AND products not meeting FSSAI standards - the subsector is
  human-supplied), the Hawker/Petty-retailer/other non-manufacturing rows, and product-approval
  prerequisites for non-specified food. No threshold is invented. Currentness grounding: SRC-011 is
  FSSAI's own signed Order of 13.03.2026 (superseding earlier turnover thresholds/criteria, effective
  01.04.2026), SRC-012 applies the same bands; the 10.03.2026 Gazette text is still NOT archived - see
  RULE-REV-0012. Still DRAFT; no human VER exists.
  Provenance correction (approval pass, 2026-09-26): RF-0013 (the historical Schedule-1 dairy/entry-V
  mutual-exclusivity statement) is no longer cited by this Rule Version because the final model does not
  use the five-subsector guard COND-0032. It remains on the superseded predecessors.

