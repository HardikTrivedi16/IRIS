logic: "COND-0065 = (manufactures_schedule1_eee==true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - manufacturer of Schedule-I EEE (incl. contract manufacture) must register on the CPCB EPR e-waste portal, separately from any producer registration.
false_outcome: >
  NOT_APPLICABLE - the project does not manufacture Schedule-I EEE.
unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine until manufactures_schedule1_eee is known.

required_project_facts:
