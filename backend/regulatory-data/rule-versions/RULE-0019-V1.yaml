  New Rule (2026-09-23). KEEP_DRAFT per the normalized research —
  Schedule X is outside the IRIS MVP (Phase 0 §3), a scope/priority
  decision, not a legal gap (confidence remains VERIFIED, same as PH-01/
  PH-02). Aggregated under REQ-0003 via `classification_rule_ids`; see
  RULE-0017's validation_notes for the engine-mechanics reasoning.

batch2_note: >
  Batch 2 (2026-09-26): Rule 69(1)(b) (Form 24F) and Rule 75(2) (Form 27B) confirmed against the
  CDSCO compiled Rules (SRC-013). The Form-28 prerequisite is stated in the outcome text but is
  not modelled as a fact. Schedule X remains outside the original IRIS MVP scope; grounding
  is now primary, so the KEEP_DRAFT reason is scope/priority only.

