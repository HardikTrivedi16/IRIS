validation_notes: >
  Preserves the two threshold criteria as alternative ("OR") conditions per Phase 4 §15, rather than
  merging into a single numeric threshold. Boundary operator (">") and units preserved exactly.

known_conflicts:
  - conflict_id: OVERLAP-0001
    summary: >
      Because RULE-0005 (this rule) and RULE-0006 each use OR across two independent dimensions
      (liquid milk volume, milk solids mass), a project can satisfy RULE-0005 on one dimension while
      simultaneously satisfying RULE-0006 on the OTHER dimension — the two rules are NOT mutually
      exclusive. This rule's own logic is unaffected and remains VERIFIED; the conflict concerns
      what a downstream engine should do when both this rule and RULE-0006 evaluate TRUE for the
      same project. See `regulatory-data/registers/rule_conflict_register.yaml` (OVERLAP-0001) for
      worked examples and the REQUIRES_EVIDENCE resolution status. No precedence between Central and
      State categories is asserted here or anywhere else in this pass.
