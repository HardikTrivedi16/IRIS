rule_version_id: RULE-0005-V1
rule_id: RULE-0005
version_number: 1

condition_expression_root_id: COND-0007
logic: "COND-0007 = OR(COND-0005: liquid_milk > 50000 L/day, COND-0006: milk_solids > 2500 MT/annum)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — the dairy unit falls within the FSSAI Schedule 1 Central Licensing Authority
  category (liquid milk > 50,000 L/day and/or milk solids > 2,500 MT/annum). NOTE: this can be
  TRUE at the same time as RULE-0006 (State category) evaluating TRUE via a different dimension —
  see `known_conflicts` (OVERLAP-0001) below. In that simultaneous-TRUE situation, the combined
  result is REQUIRES_REVIEW / UNDETERMINED_OVERLAP, not a resolved Central-vs-State determination.
false_outcome: >
  NOT_APPLICABLE — the dairy unit does not meet either Central Licensing Authority capacity
  criterion. This does not by itself mean no FSSAI licence/registration is needed — see RULE-0006
  (State category) and RULE-REV-0003 (sub-501-L/day registration-tier gap).
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine Central-category classification until the dairy unit's
  liquid milk and/or milk solids capacity is known (per Kleene OR, only the criteria still needed to
  resolve the result should be requested — see engine implementation note below).

required_project_facts:
  - project.dairy_liquid_milk_capacity
  - project.dairy_milk_solids_capacity

engine_note: >
  Because COND-0007 is a three-valued OR, a future engine implementation (Phase 7) should only
  report REQUIRES_INFORMATION for whichever of the two Project Facts remains unresolved and could
  still flip the result to TRUE — if one criterion is already known TRUE, the other need not be
  collected to reach APPLICABLE for this Rule. This is an implementation note, not new rule logic.

