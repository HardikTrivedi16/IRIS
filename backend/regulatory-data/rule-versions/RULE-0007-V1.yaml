rule_version_id: RULE-0007-V1
rule_id: RULE-0007
version_number: 1

condition_expression_root_id: COND-0021
logic: "COND-0021 = OR(AND(worker_count>=20, uses_power==true), AND(worker_count>=40, uses_power==false))"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — the establishment is a "factory" under the OSH Code, 2020,
  s.2(1)(w); registration under OSH Code Ch. II (and, transitionally, the
  Maharashtra Factories Rules 1963 plan-approval/licence machinery — see
  RULE-0008) is required.
false_outcome: >
  NOT_APPLICABLE on the 20/40-worker test as currently known — SUBJECT TO
  the caveat that Maharashtra's state notification powers may extend
  factory coverage to certain smaller/notified activities (e.g. powerlooms,
  solvent processes) regardless of headcount (DISH FAQ; RF-0015). This
  caveat must always accompany a FALSE/NOT_APPLICABLE presentation of this
  rule — it is never resolved to TRUE automatically, since no Project Fact
  for "is a notified activity" exists in this dataset.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine factory status until worker count
  and whether the manufacturing process uses power are known.

required_project_facts:
  - project.worker_count
  - project.manufacturing_process_uses_power

regulatory_fact_ids:
