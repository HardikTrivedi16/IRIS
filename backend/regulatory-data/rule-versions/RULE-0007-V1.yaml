rule_version_id: RULE-0007-V1
rule_id: RULE-0007
version_number: 1

condition_expression_root_id: COND-0021
logic: "COND-0021 = OR(AND(worker_count>=20, uses_power==true), AND(worker_count>=40, uses_power==false))"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - the establishment is a "factory" under the OSH Code, 2020,
  s.2(1)(w) (20 or more workers with power / 40 or more without). Being a
  factory brings it within the Code's factory provisions, including
  Chapter II registration (which applies to a factory with ten or more
  workers) and, transitionally, the Maharashtra Factories Rules 1963
  plan-approval/licence machinery - see RULE-0008, which is NOT decided
  here.
false_outcome: >
  NOT_APPLICABLE on the 20/40-worker factory-status test as currently
  known. This does NOT mean that no OSH Code registration applies: under
  s.2(1)(v)(iii) a factory with ten or more workers, and under
  s.2(1)(v)(i)-(ii) other places where ten or more workers are employed,
  are "establishments" required to register under Chapter II
  notwithstanding this test - that registration question is not evaluated
  by this Rule Version. SUBJECT TO the further caveat that Maharashtra's
  state notification powers may extend factory coverage to certain
  smaller/notified activities (e.g. powerlooms, solvent processes)
  regardless of headcount (DISH FAQ; RF-0015). These caveats must always
  accompany a FALSE/NOT_APPLICABLE presentation of this rule - it is
  never resolved to TRUE automatically, since no Project Fact for "is a
  notified activity" exists in this dataset.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine factory status until worker count
  and whether the manufacturing process uses power are known.

required_project_facts:
  - project.worker_count
  - project.manufacturing_process_uses_power

