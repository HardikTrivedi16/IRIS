validation_notes: >
  Corrects the obsolete >=10 threshold from an earlier research pass — the
  OSH Code's (and Maharashtra's own, unchanged) statutory number is 20 with
  power / 40 without. This Rule Version answers only the headcount/power
  applicability test; it does not itself model the transitional licence/
  plan-approval machinery (RULE-0008) or the notified-activity extension
  (FALSE-branch caveat only, no executable condition). Cannot be promoted
  to ACTIVE without archived SRC-006 + a human VER record — neither exists
  as of this pass.

  Batch 2 (2026-09-26): archived the Code text (SRC-032) and commencement
  S.O. 5321(E) (SRC-033); effective_start_date set from that primary
  notification. Applicability logic (COND-0021) is UNCHANGED. Outcome text
  corrected: the Rule Version answers FACTORY STATUS only; Chapter II
  registration reaches factories with >=10 workers and other
  establishments with >=10 workers (s.2(1)(v)), so a NOT_APPLICABLE here is
  never a statement that no registration applies. Encoded-scope limits:
  (1) worker_count is one number - the Code counts workers working "on any
  day of the preceding twelve months" across all groups/relays
  (Explanation I); (2) Maharashtra's 20/40 rests on DISH-Maharashtra's website FAQ
  (SRC-034: an official ADMINISTRATIVE statement, not a Gazette notification; unarchived) - the State notification is not archived;
  (3) notified-activity extension, mobile units/railway sheds/hotels
  exclusions and the RULE-0008 licence/plan-approval machinery are not
  modelled. Still DRAFT; no human VER exists.

approval_note: >
  Promoted to ACTIVE on 2026-09-26 after human approval (Hardik Trivedi, VER-0014) for the encoded scope; see
  the APPROVED VER record for this Rule Version. All documented limitations in this file's notes remain in force.
