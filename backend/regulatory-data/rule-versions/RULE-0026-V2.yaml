validation_notes: >
  Batch 2 (2026-09-26) corrected successor to RULE-0026-V1, which (a) omitted limbs
  (iii)-(iv) of the producer definition (imports) and (b) ignored r.2(c), under which
  the Rules do not apply to micro enterprises. RULE-0026-V1 is preserved as SUPERSEDED
  (no dates: an incomplete encoding, not an earlier legal regime). effective_start_date
  2023-04-01 is the Rules' commencement (r.1(2), SRC-016). Substantive correction to
  report: projects previously NOT_APPLICABLE because own_brand was false now evaluate
  REQUIRES_INFORMATION until the import fact and MSME classification are supplied
  (fail-safe). Not encoded: whether a given item is Schedule-I EEE (human-supplied
  facts), EPR targets/Schedules III-IV, other categories. No human VER exists.
  Currentness sweep (2026-09-26): CLEARED through 2026-09-26 on CPCB's live E-Waste rules page (newest
  instrument: Third Amendment Rules 2024, G.S.R. 164(E), 08.03.2024) and searches finding no later
  E-Waste amendment; that page is not a statutory register.

