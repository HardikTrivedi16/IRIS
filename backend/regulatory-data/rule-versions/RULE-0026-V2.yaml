rule_version_id: RULE-0026-V2
rule_id: RULE-0026
version_number: 2

condition_expression_root_id: COND-0080
logic: "COND-0080 = AND(OR(sells_schedule1_eee_under_own_brand==true, sells_imported_schedule1_eee_or_imports_used_schedule1_eee==true), msme_classification NOT_IN [MICRO])"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - the project is a "producer" of Schedule-I EEE (E-Waste Rules 2022
  r.3(1)(t): own-brand sale of manufactured or assembled EEE, sale of imported EEE, or
  import of used EEE) and is not a micro enterprise: it must register on the CPCB EPR
  e-waste portal (r.4(1)(b)), may not carry on business without registration (r.4(3)),
  and EPR recycling targets apply per the Schedules.

false_outcome: >
  NOT_APPLICABLE on this trigger - the project is not a producer of Schedule-I EEE
  (no own-brand sale and no sale of imported / import of used EEE), OR it is a micro
  enterprise, to which the Rules do not apply (r.2(c)).

unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine until the own-brand and import facts and
  the MSME classification are known.


required_project_facts:
  - project.sells_schedule1_eee_under_own_brand
  - project.sells_imported_schedule1_eee_or_imports_used_schedule1_eee
  - project.msme_classification

