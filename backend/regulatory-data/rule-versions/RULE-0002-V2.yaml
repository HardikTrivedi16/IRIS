validation_notes: >
  Wave 1C (2026-09-26) corrected successor to RULE-0002-V1, which is
  PRESERVED UNEDITED as the pre-2024-exemption logic. Legal change:
  G.S.R. 702(E) of 12.11.2024 (SRC-019), issued under the proviso to s.21(1)
  as substituted by the Jan Vishwas Act, 2023 (SRC-022), exempts White-category
  plants (from s.21(1) entirely) and prior-EC plants ('in respect of previous
  consent to establish' only).

  CTE / CTO DISTINCTION - NOT COLLAPSED, NOT MODELLED AS A SECOND OUTCOME: the
  Requirement REQ-0002 is a single combined establish-or-operate question
  (see its requirement_notes). A prior-EC plant is CTE-exempt but CTO-required,
  so its correct Requirement-level answer is still APPLICABLE (consent to
  operate). Because the engine's output_mapping has only APPLICABLE /
  NOT_APPLICABLE / REQUIRES_INFORMATION and an unchanged APPLICABLE result is
  the accurate one, project.holds_prior_environmental_clearance is
  deliberately NOT consumed here (no unused fact is declared); the nuance
  lives in true_outcome and in REQ-0002's wave_1c_note. If the reviewer wants
  the CTE and CTO components decided separately, that requires splitting
  REQ-0002 into two Requirements - a decision reserved for the human.

  STILL DRAFT / NOT ACTIVE; effective_start_date deliberately null. Open
  items: (1) the Jan Vishwas Act comes into force on notified dates
  (s.1(2)) and the commencement notification for the Air Act entries was not
  located, although G.S.R. 702(E) is itself made under the substituted
  proviso; (2) the Air Act applies to Maharashtra in its own right, but MPCB's
  circular of 16.06.2025 (SRC-023) describes White-category consents as
  self-certified via its portal; (3) the written-intimation condition and the
  Schedule (pollution index <= 20 / MPCB's additional 222 activities) are not
  modelled - is_white_category_industrial_plant is human-supplied; (4) the
  location fact is the unchanged V1 fact. No human VER exists.

  Batch 2 (2026-09-26) - RESULT: CLEAR FOR HUMAN APPROVAL (encoded scope).
  effective_start_date set to 2024-11-12, the date of G.S.R. 702(E)
  (archived SRC-019). Commencement: the Air Act applies to Maharashtra in
  its own right (no State adoption step, unlike the Water Act). The Jan
  Vishwas Act's own commencement notification for the Air Act entry was not
  located as a primary artifact, but G.S.R. 702(E) is itself made "in
  exercise of power conferred by the proviso to sub-section (1) of section
  21" of the Air Act, i.e. a Gazette notification exercising the substituted
  proviso on 12.11.2024, and the MoEFCC SOP (SRC-020) and MPCB circular
  (SRC-023) implement it - so the proviso is treated as in force by that
  date. CTE vs CTO: NOT split. s.21(1) is ONE consent provision for
  establishing OR operating; (a) White category is exempt from s.21(1)
  entirely (on written intimation), while (b) prior-EC plants are exempt
  only "in respect of previous consent to establish". The combined
  Requirement is therefore accurate: APPLICABLE means some s.21 consent is
  needed (CTE+CTO, or CTO only for a prior-EC plant); it never wrongly
  answers NOT_APPLICABLE for a prior-EC plant. Two separate Requirements
  would only be needed to give CTE and CTO independent outcomes, which the
  encoded question does not require. MPCB's own page says White-category
  industries need no Consent to Operate and only notify the Board;
  MPCB circular SRC-023 speaks of "self-certification" - procedural steps
  that are NOT modelled. Limits unchanged: Schedule / pollution-index
  membership and the 222 MPCB-listed activities are supplied as
  is_white_category_industrial_plant; the location fact is unchanged.

