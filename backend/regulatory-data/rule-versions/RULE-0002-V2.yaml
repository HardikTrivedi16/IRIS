rule_version_id: RULE-0002-V2
rule_id: RULE-0002
version_number: 2

condition_expression_root_id: COND-0071
logic: "COND-0071 = AND(plant_located_in_air_pollution_control_area==true, is_white_category_industrial_plant==false)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE - some prior consent of the State Board under Air Act, 1981,
  s.21(1) is required (establish or operate) and the plant is not a
  White-category plant. If the plant also holds prior environmental clearance
  in respect of consent to establish (project.holds_prior_environmental_clearance),
  the CONSENT-TO-ESTABLISH component is exempt (G.S.R. 702(E)(b)) but the
  CONSENT-TO-OPERATE component still applies - APPLICABLE then means consent to
  operate only. Prior-EC status is not machine-evaluated by this Rule Version.

false_outcome: >
  NOT_APPLICABLE on this trigger - the plant is not located in a declared air
  pollution control area, OR it is a White-category plant (pollution index score
  up to 20, exempt from s.21(1) on written intimation to the State Board,
  G.S.R. 702(E)(a)). This does not evaluate any other provision that might
  independently require MPCB consent, nor MPCB's self-certified consent handling
  of White category units.

unknown_outcome: >
  REQUIRES_INFORMATION - cannot determine applicability until the plant's
  location relative to a declared air pollution control area and its
  White-category status are known.


required_project_facts:
  - project.plant_located_in_air_pollution_control_area
  - project.is_white_category_industrial_plant

