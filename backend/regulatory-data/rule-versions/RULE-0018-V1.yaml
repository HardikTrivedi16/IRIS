batch2_note: >
  Batch 2 (2026-09-26): true_outcome text corrected against Rules 75 and 68A (SRC-013). The
  applicability condition is unchanged. Known limitations: the Form 27 vs Form 27D split (LVP,
  Sera, Vaccines, r-DNA) and Part XB exclusion are not separately modelled - there is no
  sub-category fact, so the outcome text states the exception rather than computing it.
  Currentness sweep (2026-09-26): CDSCO's official Gazette Notifications page (newest entry 2026-09-08)
  shows no final notification after 01-07-2024 amending rr.69, 72, 75, 77 or Forms 24/25/27/28; a secondary
  index lists G.S.R. 758(E) of 16-10-2025 (additional items under the Central Licence Approving Authority,
  Rule 68A), which widens the notified list only - RULE-0018's text refers to notified drugs generically.

