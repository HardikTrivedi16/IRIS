rule_version_id: RULE-0018-V1
rule_id: RULE-0018
version_number: 1

condition_expression_root_id: COND-0051
logic: "COND-0051 = AND(COND-0003, drug_schedule_classification==SCHEDULE_C_OR_C1)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — the Rule 75 licence-application pathway applies: an
  application for grant or renewal of a licence to manufacture the
  Schedule C/C(1) drug(s) for sale/distribution is made to the State
  Licensing Authority (FDA Maharashtra, with CDSCO joint inspection for
  certain categories) in Form 27 (r/w r.75(3) for endorsement of added
  items); the licence is issued in Form 28.
false_outcome: >
  NOT_APPLICABLE on this pathway — either the coarse drug-manufacturing
  gate does not clear (RULE-0003), or the drug schedule classification is
  not SCHEDULE_C_OR_C1 (see RULE-0017/PH-01 for NONE, or RULE-0019/PH-03
  for Schedule-X-related products, including the combined C/C1+X case).
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine this pathway's applicability
  until manufactures_drugs_for_sale_or_distribution, pharma_activity_type,
  and drug_schedule_classification are known.

required_project_facts:
  - project.manufactures_drugs_for_sale_or_distribution
  - project.pharma_activity_type
  - project.drug_schedule_classification

