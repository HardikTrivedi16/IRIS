rule_version_id: RULE-0023-V1
rule_id: RULE-0023
version_number: 1

condition_expression_root_id: COND-0061
logic: "COND-0061 = (holds_drug_manufacturing_licence==true)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — the licence remains valid perpetually unless sooner
  suspended or cancelled, subject to (a) compliance/GMP assessment not
  less than once every three years or as needed on a risk-based
  approach, and (b) a retention fee payable before the expiry of every
  succeeding five years from the date of issue (G.S.R. 1337(E) series,
  2017). This is a continuing obligation, not periodic renewal — non-
  payment carries its own suspension/cancellation consequence, not mere
  lapse.
false_outcome: >
  NOT_APPLICABLE — the project does not hold a drug manufacturing
  licence, so the retention-fee duty does not attach.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine retention-duty applicability
  until holds_drug_manufacturing_licence is known.

required_project_facts:
  - project.holds_drug_manufacturing_licence

