rule_version_id: RULE-0020-V1
rule_id: RULE-0020
version_number: 1

condition_expression_root_id: COND-0056
logic: "COND-0056 = (pharma_activity_type==BULK_DRUG_OR_INTERMEDIATE)"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — Environmental Clearance under EIA 2006 Schedule item 5(f)
  could apply. Which category (A/MoEFCC outside, or B/SEIAA-MH inside a
  notified industrial area/estate) governs is answered by RULE-0021
  (Category A) / RULE-0022 (Category B), evaluated as this
  Requirement's classification members.
false_outcome: >
  NOT_APPLICABLE — the project's pharma activity is not
  BULK_DRUG_OR_INTERMEDIATE (e.g. FORMULATIONS is explicitly excluded by
  5(f)'s own words, "excluding drug formulations").
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine whether 5(f) could apply until
  pharma_activity_type is known.

required_project_facts:
  - project.pharma_activity_type

