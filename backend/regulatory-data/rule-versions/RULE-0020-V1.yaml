validation_notes: >
  New Rule (2026-09-23). KEEP_DRAFT per the normalized research H2.2 —
  consolidated 5(f) text not assembled (H5 #6). No Regulatory Fact/
  Evidence/Source authored for this pass — fields deliberately empty,
  not fabricated. `authority_id: AUTH-MoEFCC` is nominal here (the gate
  itself doesn't distinguish A/B); the real per-category authority is on
  RULE-0021 (MoEFCC) and RULE-0022 (SEIAA-MH).
