validation_notes: >
  KEEP_DRAFT independently of archival — this Rule Version's blocker is a
  genuinely open Maharashtra state-rules question (Maharashtra's OSH Code
  state rules were still DRAFT as of the research pack's verification
  date), not a citation/archival gap. Do not promote this Rule Version to
  ACTIVE merely because RULE-0007-V1 (the applicability test it shares a
  condition tree with) is eligible for promotion — the two answer
  different questions and have independent lifecycle status per H2.1 of
  MH_MULTI_SECTOR_REGULATORY_RESEARCH.md.
