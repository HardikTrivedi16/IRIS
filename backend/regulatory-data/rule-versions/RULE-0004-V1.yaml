validation_notes: >
  RF-0008/EVID-FSS-01 does not itself define "food business" or map it to IRIS's
  `project.industry` classification variable; that mapping is a Phase 5 modeling choice grounded in
  Phase 0 §2/§4's industry scope, not a literal restatement of the evidence. Flagged with
  `confidence: REQUIRES_REVIEW` rather than VERIFIED for this reason, distinct from RULE-0001/0002
  whose conditions are near-verbatim restatements of their evidence.
