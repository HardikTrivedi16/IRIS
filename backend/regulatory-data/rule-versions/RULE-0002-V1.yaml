rule_version_id: RULE-0002-V1
rule_id: RULE-0002
version_number: 1

condition_expression_root_id: COND-0002
logic: "single condition — no composite expression required"

output_mapping:
  TRUE: APPLICABLE
  FALSE: NOT_APPLICABLE
  UNKNOWN: REQUIRES_INFORMATION

true_outcome: >
  APPLICABLE — prior consent of the State Board under Air Act, 1981, Section 21(1) is required
  before establishing or operating the industrial plant.
false_outcome: >
  NOT_APPLICABLE — the plant is not, on current information, located within a declared air
  pollution control area, so the Section 21(1) trigger evidenced in RF-0002 is not met. This does
  not evaluate any other provision that might independently require MPCB consent.
unknown_outcome: >
  REQUIRES_INFORMATION — cannot determine applicability until the plant's location relative to a
  declared air pollution control area is known.

required_project_facts:
  - project.plant_located_in_air_pollution_control_area

