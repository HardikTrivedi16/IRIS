validation_notes: >
  Answers only the Section 21(1) location question the evidence poses. Does not assert that all
  factories require MPCB Consent to Establish/Operate under the Air Act, and does not define what
  makes an area a "declared air pollution control area" beyond the statute's own words — that
  classification is a separate evidenced fact for a future phase if needed. Cannot be promoted to
  ACTIVE without a `VER` record (Phase 2 §19 V-7).
