# IRIS — Phase 5 Rule Review Register
# Mirrors the intent of Phase 4's Review Register (Phase4.md §10): anything that cannot safely
# become an executable Rule/Rule Version is recorded here instead of being forced into one, or
# instead of silently converting a Regulatory Fact's known gap into a fabricated rule outcome.

review_items:

  - review_id: RULE-REV-0001
    subject: "Factories Act §6(1)(a) central enabling provision — Maharashtra factory-plan-submission requirement"
    related_regulatory_fact_ids: [RF-0003]
    related_phase4_review_id: REV-0001
    reason: >
      RF-0003 establishes only that the central Factories Act, 1948 gives the State Government a
      rule-making power to require factory-plan submission — it does not itself establish that
      Maharashtra exercised that power in a way that creates a mandatory, evidenced obligation.
      Phase 3 could not verify the current text of Maharashtra Factories Rules, 1963, Rule 3
      (EVID-DISH-02, REQUIRES_REVIEW), so Phase 4 did not normalize it into a fact, and per the
      Phase 5 brief §14, no executable Rule may be authored asserting "Maharashtra factory → factory
      plan approval required" from RF-0003 alone.
    decision: >
      No RULE / RULE_VERSION was created for RF-0003. This is Option 1 from the Phase 5 brief §14
      (create no executable applicability rule yet, and place it in the review register), which the
      brief explicitly prefers over authoring a non-final framework/review rule.
    current_status: REQUIRES_REVIEW
    what_is_needed: "An authoritative, current Maharashtra Factories Rules 1963 Rule 3 (or applicable current provision) text, collected in a further Phase 3 pass."
    next_phase: "Phase 3 (further evidence collection), then Phase 4 (normalization), before Phase 5 can safely author a rule against this gap."
    blocks: "Any future Rule asserting a Maharashtra-specific factory-plan-approval obligation."

  - review_id: RULE-REV-0002
    subject: "Drugs Rules — licence-application provision governing Schedule C / Schedule C(1) / Schedule X"
    related_regulatory_fact_ids: [RF-0007, RF-0025, RF-0026, RF-0027]
    related_phase4_review_id: REV-0005
    reason: >
      RF-0007 confirms the Rule 69(1)/Form 24 pathway (RULE-0003) explicitly excludes Schedule C,
      Schedule C(1), and Schedule X drugs, but no evidence was collected for what provision instead
      governs manufacturing-licence applications for those schedules.
    decision: >
      RESOLVED (2026-09-23, Pharma tranche — MH_MULTI_SECTOR_REGULATORY_RESEARCH.md §7/§12/H1).
      Primary-source evidence for both excluded schedules is now collected: PH-02 (RULE-0018,
      RF-0026) covers Schedule C/C(1) via Rule 75/Form 27-28; PH-03 (RULE-0019, RF-0027, KEEP_DRAFT)
      covers Schedule X and the combined C/C1+X case via Rule 69(1)(b)/Form 24-F-25-F and Form
      27-B-28-B. RULE-0003 was repurposed from the schedule-specific NONE test to a coarse
      drug-manufacturing gate (RF-0025); PH-01 (RULE-0017, the former RULE-0003 test) is now its own
      Rule. All three (RULE-0017/0018/0019) are aggregated under REQ-0003 via
      `classification_rule_ids` — see RULE-0017's validation_notes for why this required splitting
      the coarse gate from the schedule-specific test (an `iris_engine.classification` combine-logic
      constraint, verified by tracing the actual code, not assumed). RULE-0003-V1's FALSE branch no
      longer maps to REQUIRES_REVIEW — it now correctly maps to NOT_APPLICABLE on the coarse gate
      itself, with the schedule-specific answer available via classification.
    current_status: RESOLVED
    what_is_needed: "None for PH-01/PH-02. PH-03 remains KEEP_DRAFT (MVP scope/priority decision per Phase 0 §3, not a legal gap) — human verification (APPROVED VER) still required before any of RULE-0017/0018/0019 can promote to ACTIVE; none was created this pass."
    next_phase: "Human verification of RULE-0017/0018/0019, then ACTIVE promotion consideration for PH-01/PH-02 (PH-03 stays DRAFT by scope choice)."
    blocks: "ACTIVE promotion of RULE-0017, RULE-0018, or RULE-0019 pending human verification (APPROVED VER) — not blocked on any further evidence collection."

