notes: >
  Instrument-level issuing authority for the Water (P&CP) Act, 1974 and Air
  (P&CP) Act, 1981 (central Parliament-enacted Acts under this Ministry's
  administrative lineage), per Phase 4's provenance convention of
  attributing RF/RuleVersion authority_id to the instrument's issuing
  authority rather than the state enforcing body (see REQ-0001's
  authority_attribution_note). Already referenced by
  RULE-0001-V1/RULE-0002-V1 prior to this record's creation.

  PHARMA TRANCHE (2026-09-23): also used by PH-04 (REQ-0014, RULE-0020 —
  Category A, outside a notified industrial area/estate) for
  Environmental Clearance under EIA 2006 Schedule item 5(f). Creatable
  now per the normalized research's H2.2 even though PH-04's Regulatory
  Fact is blocked (consolidated 5(f) text not assembled) — an authority
  record carries no evidentiary claim about the rule's own readiness.
