rule_id: RULE-0003
code: DRUGS_MANUFACTURING_LICENCE_COARSE_GATE
requirement_id: REQ-0003   # linked in Phase 6 — see requirement_id_note

title: "Drugs Rules, 1945 — drug-manufacturing-licence coarse applicability gate"
output_type: APPLICABILITY

description: >
  REPURPOSED 2026-09-23 (normalized-research H1 "CORRECT" disposition —
  see rule_review_register.yaml RULE-REV-0002). Determines only whether
  SOME drug-manufacturing-licence pathway could apply at all
  (manufactures_drugs_for_sale_or_distribution == true AND
  pharma_activity_type NOT_IN [REPACKING]), independent of which drug
  schedule the product falls in. Formerly this Rule directly tested the
  Schedule-C/C(1)/X exclusion (the Form-24/NONE-schedule pathway) — that
  schedule-specific test now lives in RULE-0017 (PH-01), a new Rule
  aggregated under this same REQ-0003 via `classification_rule_ids`
  alongside RULE-0018 (PH-02) and RULE-0019 (PH-03). This split is
  required by the engine's classification-combination mechanics — see
  RULE-0017's validation_notes for the exact reasoning.

rule_type: APPLICABILITY_RULE

requirement_id_note: >
  Same Phase-6 linkage rationale as RULE-0001. This Rule grounds
  REQ-0003 as its `evaluated_by_rule_id` (the coarse gate), with
  RULE-0017/0018/0019 as `classification_rule_ids` answering which
  specific form-pathway (if any) applies. See REQ-0003's
  requirement_notes for the historical Rule-70/Form-25 vs. Rule-69/
  Form-24 discrepancy note (unaffected by this repurposing).

current_active_rule_version_id: RULE-0003-V1
