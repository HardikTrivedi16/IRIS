notes: >
  Wave-1B archival (2026-09-26): downloaded from
  https://cpcb.nic.in/upload/home/water-pollution/GSR-703(E)-12-11-2024.pdf;
  SHA-256 computed from the saved bytes. Gazette of India Extraordinary No.
  644, 4 pages, Ministry of Environment, Forest and Climate Change, hosted by
  CPCB. Exempts (a) all industrial plants having pollution index score up to
  20 as listed in the Schedule (white category; condition: the plant informs
  the State Board/Committee in writing) and (b) all industrial plants that
  obtained prior environmental clearance under S.O. 1533(E) 14.09.2006 'in
  respect of previous consent to establish'. Effective on publication,
  12.11.2024 (no deferred date). ARCHIVED means only that this artifact is
