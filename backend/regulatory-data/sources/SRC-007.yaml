  NOT archived at Wave 1 (archived later as SRC-028, see Wave-1C update below). ARCHIVED means only that this artifact is archived; it does
  not mean the evidence is human-verified (evidence rows remain UNVERIFIED).
  Wave-1C update (2026-09-26): the commencement notification S.O. 1943(E)
  of 30.04.2025 IS now archived as SRC-028 (DPIIT-hosted Gazette copy). It
