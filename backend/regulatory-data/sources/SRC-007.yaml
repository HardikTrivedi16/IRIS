  Wave-1 archival (2026-09-26): the exact artifact was downloaded from
  https://fabkerala.gov.in/eng/images/Acts%20and%20Rules/Acts/Boiler-Act-2025.pdf
  and its SHA-256 computed from the saved bytes. Gazette of India
  Extraordinary, Part II Sec. 1, No. 12, 4 April 2025
  (CG-DL-E-04042025-262299), 18 pages, hosted by the Government of Kerala
  Department of Factories & Boilers (an identical-text copy was also found on
