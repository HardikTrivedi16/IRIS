notes: >
  Batch-2 archival (2026-09-26): downloaded from the Department of Consumer
  Affairs (Government of India) website; SHA-256 computed from the saved bytes.
  Gazette of India Extraordinary Part II Sec. 3(i) No. 377, DoCA. In force on
  publication. r.3 amends Rule 27: inserts clause (d) in sub-rule (2), a proviso to
  sub-rule (3) and new sub-rule (5) ('registration certificates shall remain valid
  until cancelled'). Rule 27(1) - the registration trigger - is NOT amended.
  CURRENTNESS CHECK (2026-09-26, Rule 27 only): the Department's own Legal Metrology
  (Packaged Commodities) amendment list was walked for 2017 to the Fourth Amendment
  Rules of 21.09.2026 (22 instruments text-searched: 2017 + corrigendum, 2021, 2022
  x5, 2023 x8, 2025 x2, 2026 x4); the only one found to amend Rule 27 is this
  instrument; the 2017 amendment's Rule 2 changes (consumer, institutional consumer,
  e-commerce, retail sale price) and later Rule 3/4/6/26 changes do not touch the
  r.27(1) trigger wording. Amendments listed for 2011-2016 were read in an earlier
  pass (SRC-009 notes). ARCHIVED means only that this artifact is archived; it is
  not a human verification of any Evidence or Rule.
