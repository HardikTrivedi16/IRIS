  Wave-1B update (2026-09-26): ten amendment instruments (2011 third-amendment
  corrigendum through 2017, India Code) were read and none touches Rule 27;
  amendments after 2017 were not located and remain unreconciled. Chapter II's
  'retail sale' limit (Rule 3 heading) does not apply to Rule 27, which is
  worded 'for sale, distribution or delivery' and also covers importers.
  Wave-1C update (2026-09-26): a narrow Rule-27-only currentness check was made
  against a state-department consolidation 'with all amendments as on
  24.12.2024' (archived as SRC-027, secondary/non-Gazette): Rule 27(1)'s trigger
  wording ('pre-packs or imports any commodity for sale, distribution or
  delivery') is unchanged and carries no amendment footnote. Gazette amendment
  instruments after 2017 were still not retrieved individually.
