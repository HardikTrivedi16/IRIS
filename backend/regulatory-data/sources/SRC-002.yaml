notes: >
  Citation reproduced from MH_MULTI_SECTOR_REGULATORY_RESEARCH.md §13.3
  (SRC-MH-WATER-S25 lineage / SRC-MH-APCA-RTI) — not independently
  re-fetched by this pass. Two distinct claims share this one source
  record: (1) s.21(1) text (India Code); (2) MPCB's own RTI s.4 proactive
  disclosure that the whole of Maharashtra has been an Air Pollution
  Control Area since 06/11/1996 (mpcb.gov.in RTI disclosures, versions
  dated 31.03.2026 and 31.07.2026 per the research pack) — a secondary 2001
  CAG report states "November 1995" instead; the discrepancy is unresolved
  and flagged in EVID-MPCB-02. The 1996 gazette notification itself (the
  ideal primary source for claim 2) has not been located. Neither claim has
  been independently archived — verification_status: UNVERIFIED throughout.
  Wave-1 archival (2026-09-26): the exact artifact was downloaded from
  https://cpcb.nic.in/displaypdf.php?id=aG9tZS9haXItcG9sbHV0aW9uL05vLTE0LTE5ODEucGRm
  and its SHA-256 computed from the saved bytes. Central Pollution Control
  Board (Government of India) website copy of the Act (14 pages, scanned/OCR).
  s.21(1) (PDF p.7) and s.19(1) (p.7) confirmed. The MPCB RTI s.4 claim
  (statewide Air Pollution Control Area since 06/11/1996) is NOT in this
  artifact and remains unverified. CURRENTNESS BLOCKER FOR REQ-0002: the later
  Central exemption from s.21 consent (G.S.R. 702(E) dated 12.11.2024,
  reported on official PIB/PARIVESH pages, not archived here) is not reflected
  — see the Wave-1 human review pack. ARCHIVED means only that this artifact
  is archived; it does not mean the evidence is human-verified (evidence rows
  remain UNVERIFIED).
  Wave-1B update (2026-09-26): the later Central exemption IS now archived —
  see SRC-019 (G.S.R. 702(E), 12.11.2024), SRC-022 (Jan Vishwas Act 2023,
  Schedule item 21, substituting s.21(1) and adding the exemption proviso),
  SRC-020 (SOP) and SRC-023 (MPCB circular). This CPCB copy of the Act
  pre-dates the 2023 amendment of s.21(1). RULE-0002-V1 does not encode the
  exemptions.
