notes: >
  Wave-1C archival (2026-09-26): downloaded from the Odisha Department of
  Food Supplies & Consumer Welfare / Legal Metrology website (state
  government) and SHA-256 computed from the saved bytes. This is a STATE
  DEPARTMENT COMPILATION of the central Rules 'with all amendments as on
  24.12.2024' - a secondary consolidation, NOT a Gazette copy and NOT a
  Government of India publication. It was used only for a narrow currentness
  check of Rule 27(1): the consolidated text still reads 'who or which
  pre-packs or imports any commodity for sale, distribution or delivery' and
  Rule 27(1) carries no amendment footnote. Nothing else in the compilation
  was reconciled. The Gazette amendment instruments themselves (post-2017)
  were not retrieved. ARCHIVED means only that this artifact is archived; it
  is not a human verification of any Evidence or Rule.
