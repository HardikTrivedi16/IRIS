notes: >
  OFFICIAL ADMINISTRATIVE STATEMENT, NOT A GAZETTE NOTIFICATION AND NOT LEGISLATION. An undated FAQ answer on the
  Maharashtra DISH website, read 2026-09-26, that states the factory worker numbers as 20 (with power) / 40 (without
  power). It is used only as administrative corroboration that Maharashtra's State-law number equals the OSH Code's
  20/40 (the Code's State-number proviso). The State notification specifying those numbers under the Factories
  (Maharashtra Amendment) Act, 2015 is NOT archived. The page is not archived (no checksum); its wording predates
  or ignores the OSH Code (it mentions "less than 10 workers").
