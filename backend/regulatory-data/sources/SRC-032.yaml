notes: >
  Batch-2 archival (2026-09-26): downloaded from the Ministry of Labour and Employment's own
  site (labour.gov.in), SHA-256 computed from the saved bytes. Text reproduces the Gazette of
  India Extraordinary Act text. s.2(1)(w) "factory" (20 workers with power / 40 without, with the
  State-number proviso) was read from the saved file and matches EVID-OSH-01/EVID-OSH-04 verbatim.
  Also read: s.2(1)(v)(iii) - for Chapter II (Registration) a factory with ten or more workers is
  an "establishment" notwithstanding the s.2(1)(w) threshold; s.3 - registration of
  establishments. ARCHIVED means only that this artifact is archived; it is not a human
  verification of any Evidence or Rule. SRC-006 is retained unchanged (its Maharashtra
  20/40 corroboration is NOT archived).
