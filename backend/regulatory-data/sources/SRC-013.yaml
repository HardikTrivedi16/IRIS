notes: >
  Batch-2 archival (2026-09-26): downloaded from the CDSCO (Government of India)
  website; SHA-256 computed from the saved bytes. 963-page compiled version whose
  own cover states 'As amended vide G.S.R. 360(E) dated 01-07-2024' and whose
  DISCLAIMER says it is a compilation of Gazette amendments (NOT itself a Gazette
  copy). Used for Rule 69(1) (PDF p.59), Rule 72 (p.67), Rule 75 (p.75), Rule 77
  (p.83) and Rule 68A (p.57). Amendments after 01-07-2024 are not reconciled. The
  earlier citation to the general India Code portal is superseded by this exact
  artifact. ARCHIVED means only that this artifact is archived; it is not a human
  verification of any Evidence or Rule.
  Currentness sweep (2026-09-26): no later final amendment to rr.69/72/75/77 or Forms 24/25/27/28 was found on
