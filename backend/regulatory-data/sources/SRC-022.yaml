  Schedule item 21, PDF p.30: substitutes Air Act s.21(1) with 'No person
  shall establish or operate any industrial plant in an air pollution control
  area unless the previous consent of the State Board has been obtained...'
  plus a proviso allowing the Central Government to exempt categories of
  industrial plants. s.1(2): in force on dates notified; the commencement
  notification for the Air Act entries was not located. ARCHIVED means only
  that this artifact is archived; it is not a human verification of any
  Evidence or Rule.
