notes: >
  Per MH_MULTI_SECTOR_REGULATORY_RESEARCH.md §4 I-19: 2022-2025 amendments
  (waste tyres, non-ferrous EPR, etc.) do not alter Rule 6's core duty. Rule
  6(1): Form 1 application by every occupier handling/generating/storing/
  disposing hazardous and other wastes; Rule 6(2): Form 2 authorisation,
  valid 5 years, 120-day grant; Rule 6(3)/(4): Form 3 records, Form 4 annual
  return by 30 June, renewal 3 months prior.
