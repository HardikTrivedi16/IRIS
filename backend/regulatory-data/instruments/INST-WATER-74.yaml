notes: >
  Currency confirmed per MH_MULTI_SECTOR_REGULATORY_RESEARCH.md §4 I-01: the
  Water (P&CP) Amendment Act, 2024 (decriminalisation + Central consent-
  exemption power) applies only to HP, Rajasthan, UTs and states that have
  separately adopted it (e.g. Bihar) under Art. 252 — no Maharashtra
  adoption resolution found, so the pre-2024 Act governs in Maharashtra.
  s.25(1)(a) (RF-0001/SH-01) is unaffected either way. Watch item: monitor
  for a future Maharashtra Art. 252 adoption resolution.
