notes: >
  Per MH_MULTI_SECTOR_REGULATORY_RESEARCH.md §4 I-08/I-09: assented
  04.04.2025; brought into force 01.05.2025 by commencement notification
  S.O. 1943(E) dt 30.04.2025; repeals the Boilers Act, 1923 (s.45(1)),
  boilers registered under the 1923 Act deemed registered under this Act
  (s.45(2)(f)). s.2(c) defines "boiler" excluding capacity < 25 litres,
  design/working gauge pressure < 1 kg/cm², and water heated below 100°C
  (temperature exclusion has no corresponding Project Fact in this pass —
  see SH-04 validation_notes). Maharashtra Boiler Rules, 1962 / Indian
  Boiler Regulations, 1950 continue transitionally under s.45(2) savings
  (not separately catalogued as an instrument this pass — procedural colour
  only, no thresholds taken from them).
