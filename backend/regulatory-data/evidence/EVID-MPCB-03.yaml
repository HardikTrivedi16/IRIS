section_or_clause: "G.S.R. 703(E), 12.11.2024 - exemption under the proviso to s.25(1), Water Act 1974"
page: 3
excerpt: >
  "In exercise of power conferred by the proviso to sub-section (1) of section
  25 of the Water (Prevention and Control of Pollution) Act, 1974 (6 of 1974),
  the Central Government, in consultation with the Central Pollution Control
  Board, exempts the following categories of industrial plants from the
  application of the provisions of the said sub-section, namely:- (a) all
  industrial plants having pollution index score upto 20 as listed in the
  Schedule to this notification, subject to condition that such plant shall
  inform in writing to the State Pollution Control Boards or the Pollution
  Control Committees; (b) all industrial plants which have obtained prior
  environmental clearance as per the notification of the Government of India
  in the erstwhile Ministry of Environment and Forests number S.O. 1533(E),
  dated the 14th September, 2006 issued under the Environment (Protection) Act,
  1986 (29 of 1986), in respect of previous consent to establish such plant."
  The notification carries no deferred commencement date. The exemption in (a)
  is conditional on written intimation to the State Board; the archived copy
  does not itself define how the Schedule maps to a project.
