source_id: SRC-030
section_or_clause: "G.S.R. 418(E) 29.05.2026 - Legal Metrology (Packaged Commodities) Third Amendment Rules 2026, r.3 (amends Rule 27)"
page: 3
excerpt: >
  "3. In the principal rules, in rule 27,-- (i) in sub-rule (2), after clause (c),
  the following clause shall be inserted, namely:-- "(d) the name of the Director of
  the company responsible for violations under the Act and rules made thereunder.";
  (ii) to sub-rule(3), the following proviso shall be inserted ... (iii) after
  sub-rule (4), the following sub-rule shall be inserted, namely:-- "(5) The
  registration certificates shall remain valid until cancelled."". Rule 27(1), the
  registration trigger ('pre-packs or imports any commodity for sale, distribution or
  delivery'), is not amended by this instrument or by any other amendment found on
  the Department's list (see SRC-030 notes).
verification_status: VERIFIED
