source_id: SRC-013
section_or_clause: "Rules 72 and 77(1), Drugs Rules 1945 (compiled to G.S.R. 360(E) 01-07-2024)"
page: 67; 83
excerpt: >
  "72. Duration of licence.--(1) A licence issued in Form 25, Form 25B and Form 25F
  shall remain valid if the licencee deposits a licence retention fee referred to in
  sub-rule (2) before the expiry of a period of every succeeding five years from the
  date of its issue, unless, it is suspended or cancelled by the licensing authority.
  (2) The licence retention fee ... shall be equivalent to the respective fee
  required for the grant of such licence excluding inspection fee paid for grant of
  licence. (3) If the licencee fails to pay licence retention fee on or before the due
  date ... he shall be liable to pay licence retention fee along with a late fee
  calculated at the rate of two per cent, of the licence fee for every month or part
  thereof up to six months, and in the event of non-payment of such fee, the licence
  shall be deemed to have been cancelled." "77. Duration of licence.--(1) A licence
  issued in Form 28, Form 28B and Form 28D shall remain valid, if the licencee
  deposits a licence retention fee ... before the expiry of period of every
  succeeding five years from the date of its issue, unless it is suspended or
  cancelled". Rule 73AA gives the same for loan licences in Form 25A. No fee amount
  is stated here: the fee equals the grant fee, which varies by rule/Form.
