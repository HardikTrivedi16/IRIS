evidence_id: EVID-DRUGS-01
source_id: SRC-013
section_or_clause: "Rule 69(1)(a)-(c), Drugs Rules 1945 (compiled to G.S.R. 360(E) 01-07-2024)"
page: 59
excerpt: >
  "69. Application for licence to manufacture drugs other than those specified in
  Schedules C and C (1) ... (1) Application for grant of licence to manufacture for
  sale or for distribution of drugs, other than those specified in Schedules C and
  C(l) shall be made to the licensing authority appointed by the State Government
  for the purpose of this Part ... and shall be made-- (a) in the case of repacking
  of drugs excluding those specified in Schedule X for sale or distribution in Form
  24B; (b) in the case of manufacture of drugs included in Schedule X in Form 24F;
  (c) in any other case, in Form 24." The words 'or renewal' were omitted from Rule
  69(1) by G.S.R. 1337(E) of 27.10.2017 (no renewal application now exists; see
  EVID-DRUGS-05). The Form in which the licence is issued (Form 25) is named in Rule
  72 (EVID-DRUGS-05), not in Rule 69(1).
verification_status: VERIFIED
