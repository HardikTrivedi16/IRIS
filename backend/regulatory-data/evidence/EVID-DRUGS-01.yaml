section_or_clause: "Rule 69(1)(c); Form 24 / Form 25"
page: null
excerpt: >
  Rule 69(1)(c): an application for the grant or renewal of a licence to
  manufacture for sale, or for distribution, of any drug other than those
  specified in Schedules C, C(1), and X shall be made in Form 24 to the
  licensing authority appointed by the State Government in this behalf,
  and the licence shall be issued in Form 25.
