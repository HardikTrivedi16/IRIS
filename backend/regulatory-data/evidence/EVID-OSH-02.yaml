section_or_clause: "DISH-Maharashtra website FAQ - definition of factory (official administrative statement, not a Gazette)"
page: null
excerpt: >
  "Factory means any premises where in 20 or more workers are working to carry out a manufacturing process
  with the aid of powers OR whereon 40 or more workers are working to carry out a manufacturing process
  without the aid of power. Also Government has made this act applicable to power looms, saw mills, certain
  industries which use hazardous chemicals, and certain processes carried out using flammable solvents by
  publishing a notification, even if the number of workers are less than 10." (The Code text of
  s.2(1)(w)(ii) and the State-number proviso are in EVID-OSH-04, from the archived SRC-032.)
verification_status: VERIFIED
