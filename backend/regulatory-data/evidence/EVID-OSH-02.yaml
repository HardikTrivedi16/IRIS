section_or_clause: "Section 2(1)(w)(ii), with State-number proviso"
page: null
excerpt: >
  "whereon forty or more workers are working, or were working on any day
  of the preceding twelve months, and in any part of which a manufacturing
  process is being carried on without the aid of power". Proviso: a
  State-law worker number in force immediately before the Code's
  commencement continues to apply in that State until amended —
  Maharashtra's own number (Factories (Maharashtra Amendment) Act, 2015,
  wef 01.02.2016) is already the same 20/40, confirmed by DISH-Maharashtra's
  own FAQ. FALSE-branch caveat: State notification powers may extend
  coverage to certain smaller/notified activities (e.g. powerlooms, solvent
  processes) regardless of headcount — this does not change the executable
  20/40 threshold itself, but must be stated wherever the FALSE outcome is
  shown.
verification_status: UNVERIFIED
