source_id: SRC-007
section_or_clause: "Sections 12(6), 13(1), 13(3)-(4), 15, 23"
page: null
excerpt: >
  s.12(6): a boiler certificate is valid for a period not exceeding 12
  months (24 months for an economiser or unfired boiler in an oil/asphalt/
  bitumen plant). s.13(1): a certificate ceases to be in force on (a)
  expiry, (b) an accident occurring to the boiler, (c) the boiler being
  moved (except a vertical boiler with heating surface under 20 m²), (d)
  structural alteration/repair, or (e) a prohibition order. s.13(3)-(4):
  renewal requires inspection by a competent person within 15 days. s.15:
  continued use pending renewal is permitted only where renewal was applied
  for before expiry. s.23: accidents must be reported within 24 hours.
