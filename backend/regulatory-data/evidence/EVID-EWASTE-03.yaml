section_or_clause: "E-Waste (Management) Rules 2022 - r.2 (application; exclusions)"
page: 21
excerpt: >
  "2. Application. - These rules shall apply to every manufacturer, producer
  refurbisher, dismantler and recycler involved in manufacture, sale, transfer,
  purchase, refurbishing, dismantling, recycling and processing of e-waste or
  electrical and electronic equipment listed in Schedule I ... but shall not apply to
  - (a) waste batteries as covered under the Battery Waste Management Rules, 2022;
  (b) packaging plastics ...; (c) micro enterprise as defined in the Micro, Small and
  Medium Enterprises Development Act, 2006 (27 of 2006); and (d) radio-active wastes
  ...".
