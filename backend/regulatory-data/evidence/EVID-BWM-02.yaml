source_id: SRC-029
section_or_clause: "S.O. 4669(E) 25.10.2023 - r.2(b) (Producer definition) and r.3(b) (r.4(4)-(5))"
page: 7-8
excerpt: >
  "(b) in clause (u), for sub-clause (iii), the following sub-clause shall be
  substituted, namely:-- "(iii) import of Battery or equipment containing Battery;
  or (iv) manufacture or assembling of Battery or refurbished Battery including in
  equipment for sale to the Producer mentioned in sub-clause (ii) without its own
  brand name;"." "(4) Every Producer shall obtain registration from the Central
  Pollution Control Board through online centralised portal in Form 1(A). (5) The
  Central Pollution Control Board on registration of the Producer shall issue a
  certificate of registration in Form 1(B) to such Producer which shall be valid
  until it is cancelled or withdrawn." In force on publication (r.1(2)).
verification_status: VERIFIED
