source_id: SRC-011
section_or_clause: "Order dated 13.03.2026, paragraphs 3-5 (turnover threshold table + supersession clause)"
page: 1
excerpt: >
  "Type: Registration -- Threshold Limits: Turnover up to Rs. 1.5 crore.
  Type: State License -- Threshold Limits: Turnover above Rs. 1.5 crore and
  up to Rs. 50 crore. Type: Central License -- Threshold Limits: Turnover
  above 50 Cr." Para 4: "This supersedes all other earlier orders and
  regulations with respect to turnover thresholds or criteria specified
  under [FSS (Licensing and Registration of Food Businesses) Regulations,
  2011] for categorisation of Food Businesses." Para 5: "This revised
  turnover thresholds will come into effect from 01.04.2026."
