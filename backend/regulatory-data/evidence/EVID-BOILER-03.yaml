evidence_id: EVID-BOILER-03
source_id: SRC-028
section_or_clause: "S.O. 1943(E), 30.04.2025 (commencement of the Boilers Act, 2025)"
page: 2
excerpt: >
  "S.O. 1943(E).-- In exercise of the powers conferred by sub-section (2) of
  section 1 of the Boilers Act, 2025 (12 of 2025), the Central Government hereby
  appoints the 1st May, 2025 as the date on which the provisions of the said Act
  shall come into force." [F.No. P-30012/1/2023-Boiler], Ministry of Commerce
  and Industry (DPIIT), Gazette of India Extraordinary Part II Sec. 3(ii),
  No. 1900, 30 April 2025.
verification_status: VERIFIED
