source_id: SRC-016
section_or_clause: "E-Waste (Management) Rules 2022 - r.3(1)(t) 'producer' and r.4(1)(b), 4(3)"
page: 22-23
excerpt: >
  r.3(1)(t): "`producer' means any person or entity who,- (i) manufactures and offers
  to sell electrical and electronic equipment and their components or consumables or
  parts or spares under its own brand; or (ii) offers to sell under its own brand,
  assembled electrical and electronic equipment and their components or consumables
  or parts or spares produced by other manufacturers or suppliers; or (iii) offers
  to sell imported electrical and electronic equipment and their components or
  consumables or parts or spares; or (iv) who imports used electrical and electronic
  equipment; irrespective of the selling technique used such as dealer, retailer,
  e-retailer, etc.;" r.4(1): "The entities shall register on the portal in any of the
  following category ... (b) producer" and r.4(3): "No entity referred in sub-rule (1)
  shall carry out any business without registration." The Rules apply to equipment
  'listed in Schedule I' (r.2).
