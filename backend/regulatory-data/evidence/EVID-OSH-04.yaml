section_or_clause: "Section 2(1)(w)(ii) and proviso; section 2(1)(v)(iii)"
page: null
excerpt: >
  "(ii) whereon forty or more workers are working, or were working on any day of the preceding
  twelve months, and in any part of which a manufacturing process is being carried on without the
  aid of power, or is ordinarily so carried on ... Provided that where under any law for the time
  being in force in a State immediately before the commencement of this Code, the number of
  workers specified is more or less than the number specified in clause (i) or clause (ii), then,
  the number specified under the law of the State shall prevail in that State till it is amended
  by the competent Legislature." Separately, s.2(1)(v)(iii): "factory, for the purpose of Chapter
  II, in which ten or more workers are employed, notwithstanding the threshold of workers
  provided in clause (w)".
