section_or_clause: "Rule 75 (r/w r.75(3)); Form 27 / Form 28"
page: null
excerpt: >
  Rule 75: an application for the grant or renewal of a licence to
  manufacture for sale, or for distribution, of drugs specified in
  Schedule C or Schedule C(1) shall be made in Form 27 to the licensing
  authority, and the licence shall be issued in Form 28; r.75(3) governs
  the endorsement procedure for adding items to an existing licence.
