source_id: SRC-013
section_or_clause: "Rule 75(1) and 75(3), Drugs Rules 1945 (compiled to G.S.R. 360(E) 01-07-2024)"
page: 75
excerpt: >
  "75. Forms of application for licence to manufacture for sale or distribution of
  drugs specified in Schedules C and C (1) [excluding those specified in Part XB and
  Schedule X].-- (1) Applications for the grant of licence to manufacture for sale
  or distribution of drugs specified in Schedules C and C(1) [excluding those
  specified in Part XB and Schedule X], shall be made to the licensing authority in
  Form 27 ..." and "(3) The application for grant of licenses to manufacture for sale
  or for distribution of drugs in Large Volume Parenterals, Sera and Vaccine and
  Recombinant DNA (r-DNA) derived drugs, shall be made to the licensing authority
  appointed under this Part in Form 27D ...". Rule 68A separately provides that
  licences for drugs notified by the Central Government are GRANTED by the Central
  Licence Approving Authority, the application still being made to the licensing
  authority (PDF p.57).
verification_status: VERIFIED
