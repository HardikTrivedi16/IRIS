section_or_clause: "Rule 6(1) (Form 1; renewal application 3 months before expiry, proviso), Rule 6(2) (Form 2, 5 years, 120 days), Rule 6(5) (Form 3 records; Form 4 by 30 June)"
page: 57
excerpt: >
  Original 2016 text (G.S.R. 395(E)). Rule 6(1) (p.57): every occupier of the
  facility engaged in handling, generation, collection, storage, packaging,
  transportation, use, treatment, processing, recycling, recovery,
  pre-processing, co-processing, utilisation, offering for sale, transfer or
  disposal of the hazardous and other wastes shall apply in Form 1 to the
  State Pollution Control Board and obtain an authorisation; proviso: an
  application for renewal may be made three months before expiry. Rule 6(2)
  (p.57): on a complete application the State Board may, after inquiry and
  site inspection, grant within one hundred and twenty days an authorisation
  in Form 2, valid for five years. Rule 6(5) (p.58): every occupier authorised
  shall maintain a record in Form 3 and submit an annual return in Form 4 on
  or before the 30th day of June following the financial year. NOTE: later
  amendments (e.g. the 2019 Fourth Amendment Rules) are not reconciled in this
  artifact.
