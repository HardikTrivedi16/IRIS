section_or_clause: "Rule 6(1)-(4)"
page: null
excerpt: >
  Rule 6(1): every occupier engaged in generation, processing, treatment,
  package, storage, transportation, use, collection, destruction,
  conversion, offering for sale, or transfer of hazardous and other wastes
  shall apply in Form 1 to the State Pollution Control Board for grant of
  authorisation. Rule 6(2): authorisation in Form 2, valid for 5 years,
  granted within 120 days of site inspection. Rule 6(3): records maintained
  in Form 3; Form 4 annual return filed by 30 June. Rule 6(4): renewal
  application 3 months prior to expiry.
