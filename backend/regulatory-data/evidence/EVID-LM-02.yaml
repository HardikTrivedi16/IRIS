section_or_clause: "Rule 27(1), consolidated text with all amendments as on 24.12.2024 (state-department compilation)"
page: 41
excerpt: >
  "27. Registration of manufacturers, packers and importers.- (1) Every
  individual, firm, Hindu undivided family, society, company or corporation who
  or which pre-packs or imports any commodity for sale, distribution or
  delivery shall make an application, accompanied by a fee of rupees five
  hundred, to the Director or the Controller for the registration of his or its
  name and complete address". SECONDARY consolidation (not a Gazette copy): it
  shows the trigger wording unchanged as of 24.12.2024 and no amendment
  footnote on Rule 27(1); it does not replace the Gazette amendment
  instruments, which were not individually retrieved.
