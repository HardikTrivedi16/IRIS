section_or_clause: "G.S.R. 1337(E) series (2017) — licence-condition substitution (Forms 25/25-A/25-F/28/28-B/28-D etc.)"
page: null
excerpt: >
  "The licence, unless sooner suspended or cancelled, shall remain valid
  perpetually. However, compliance to the conditions of licence and Good
  Manufacturing Practices as laid down in Schedule M shall be assessed
  not less than once in three years or as needed as per risk based
  approach." Subject to a retention fee payable before the expiry of
  every succeeding five years from the date of issue of the licence.
