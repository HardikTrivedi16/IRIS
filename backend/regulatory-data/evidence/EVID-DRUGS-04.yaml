source_id: SRC-014
section_or_clause: "G.S.R. 1337(E) 27.10.2017 - new Rule 72 and substituted Form condition (Forms 25/25B/25F)"
page: 3; 5-6
excerpt: >
  "72. Duration of licence.- (1) A licence issued in Form 25, Form 25B and Form 25F
  shall remain valid if the licencee deposits a licence retention fee referred to in
  sub-rule (2) before the expiry of a period of every succeeding five years from the
  date of its issue, unless, it is suspended or cancelled by the licensing
  authority." Form 25 condition: "3. The licence unless sooner suspended or
  cancelled shall remain valid perpetually. However, the compliance with the
  conditions of licence and the provisions of the Drugs and Cosmetics Act, 1940 ...
  shall be assessed not less than once in three years or as needed as per risk based
  approach." (Forms 25A/28/28B para 4 and 25F/28D para 5 carry the same words.)
verification_status: VERIFIED
