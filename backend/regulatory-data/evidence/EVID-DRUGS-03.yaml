source_id: SRC-013
section_or_clause: "Rule 69(1)(b); Form 24-F / Form 25-F; Form 27-B / Form 28-B (combined Schedule C/C1 + X)"
page: null
excerpt: >
  Rule 69(1)(b): an application for the grant or renewal of a licence to
  manufacture for sale, or for distribution, of any drug specified in
  Schedule X (excluding Schedule C/C(1)) shall be made in Form 24-F, and
  the licence issued in Form 25-F. Where the drug is specified in both
  Schedule C/C(1) and Schedule X, the application is made in the combined
  Form 27-B, and the licence issued in Form 28-B.
verification_status: UNVERIFIED
