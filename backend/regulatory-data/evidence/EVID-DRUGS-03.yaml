source_id: SRC-013
section_or_clause: "Rule 69(1)(b) (Form 24F) and Rule 75(2) (Form 27B), Drugs Rules 1945 (compiled to G.S.R. 360(E) 01-07-2024)"
page: 59; 75
excerpt: >
  Rule 69(1)(b): "in the case of manufacture of drugs included in Schedule X in Form
  24F". Rule 75(2): "Application for grant of licence to manufacture for sale or
  distribution of drugs specified in Schedules C, C(l) and X shall be made to the
  licensing authority in Form 27B ... Provided that the applicant shall possess a
  licence in Form 28 to manufacture such drugs". Licences in Forms 25F and 28B
  carry the retention-fee rules 72 and 77 (EVID-DRUGS-05). The Form-28 prerequisite
  in the Rule 75(2) proviso is not captured by RULE-0019.
verification_status: VERIFIED
