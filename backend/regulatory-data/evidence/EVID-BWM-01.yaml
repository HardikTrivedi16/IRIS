source_id: SRC-015
section_or_clause: "Battery Waste Management Rules 2022 (original text) - r.3(1)(u) 'Producer' and r.4(4)"
page: 28-29
excerpt: >
  Original 2022 text. r.3(1)(u): "`Producer' means an entity who engages in: (i)
  manufacture and sale of Battery including refurbished Battery, including in
  equipment, under its own brand; or (ii) sale of Battery including refurbished
  Battery, including in equipment, under its own brand produced by other
  manufacturers or suppliers; or (iii) import of Battery as well as equipment
  containing Battery;" r.4(4): "The person or an entity involved in manufacturing of
  Battery shall have to register through the online centralised portal as Producer
  in Form 1(A). The certificate of registration shall be issued in Form 1(B)."
  Superseded by the 2023 amendment (EVID-BWM-02).
verification_status: VERIFIED
