evidence_id: EVID-MPCB-07
source_id: SRC-023
section_or_clause: "MPCB Circular No. BO/MPCB/MS Section/B-22 dated 16.06.2025 (White category self-certification)"
page: 1
excerpt: >
  "As per MoEF & CC letter No. Q-15012/2/2022/-CPW-Part(1)/e-240741, dated
  14/11/2024 Standard Operating Procedure (SOP) for implementation of the said
  Notification dated 12/11/2024, the consents for White category industries
  will be granted based on self-certification by the respective White category
  industries on the portal of the MPC Board." The Committee 'has since
  identified 222 new White category industries, along with 56 sectors already
  identified by CPCB'. This shows MPCB's implementation practice: White
  category plants are handled through a self-certified consent on the MPCB
  portal, which may not be identical to 'no consent of any kind'.
verification_status: UNVERIFIED
