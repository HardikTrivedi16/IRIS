source_id: SRC-024
section_or_clause: "HOWM (M&TM) Amendment Rules, 2019, G.S.R. 178(E), r.2(ii) inserting Rule 6(1A); r.1(2) commencement"
page: 3
excerpt: >
  "(1A) An occupier shall not be required obtain an authorisation under this
  rule, from the State Pollution Control Board, in case the consent to
  establish or consent to operate, is not required from the State Pollution
  Control Board or Pollution Control Committee under the Water (Prevention and
  Control of Pollution) Act, 1974 (25 of 1974) and Air (Prevention and Control
  of Pollution) Act, 1981 (21 of 1981); Provided that the hazardous and other
  wastes generated by the occupier shall be given to the actual user, waste
  collector or operator of the disposal facility, in accordance with the
  Central Pollution Control Board guidelines." Rule 1(2): "They shall come into
  force on the date of their publication in the Official Gazette" (Gazette
  dated 5 March 2019). The conjunction 'Water ... Act and Air ... Act' is read
  by IRIS conservatively: the exemption is encoded only where consent is not
  required under either Act.
verification_status: VERIFIED
