section_or_clause: "Rule 27(1) (Chapter VI), G.S.R. 101(E) 07.03.2011"
page: 32
excerpt: >
  "27. Registration of manufacturers, packers and importers.- (1) Every
  individual, firm, Hindu undivided family, society, company or corporation
  who or which pre-packs or imports any commodity for sale, distribution or
  delivery shall make an application, accompanied by a fee of rupees five
  hundred, to the Director or the Controller for the registration of his or
  its name and complete address; and every such application shall be made,-
  (i) in the case of an applicant pre-packing or importing any commodity on
  the date of commencement of these rules, within a period of ninety days from
  such commencement; or (ii) in the case of any applicant who or which
  commences pre-packing or importing of any commodity after the commencement
  of these rules, within ninety days from the date on which he or it commences
  such pre-packing." Original 2011 text; later amendment rules not reconciled.
  The rule also covers importers, and its trigger wording is "for sale,
  distribution or delivery" (not limited to retail sale).
