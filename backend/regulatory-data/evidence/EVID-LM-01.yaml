source_id: SRC-009
section_or_clause: "Rule 27(1)"
page: null
excerpt: >
  Every manufacturer or packer who pre-packs any commodity for the purpose
  of sale, distribution or delivery shall, within 90 days of commencing
  such pre-packing, register with the Director or, as the case may be, the
  Controller of Legal Metrology on payment of a registration fee of five
  hundred rupees.
