section_or_clause: "Water (Prevention and Control of Pollution) Amendment Act, 2024 (5 of 2024), s.1(2)-(3) (application/commencement) and s.4 (proviso to s.25(1))"
page: 2
excerpt: >
  "1. (2) It applies, in the first instance, to the whole of the States of
  Himachal Pradesh and Rajasthan and the Union territories; and it shall apply
  to such other State which adopts this Act by resolution passed in that behalf
  under clause (1) of article 252 of the Constitution read with clause (2)
  thereof. (3) It shall come into force, at once in the States of Himachal
  Pradesh and Rajasthan and the Union territories, and in any other State which
  adopts this Act under clause (1) of article 252 of the Constitution read with
  clause (2) thereof on the date of such adoption." "4. In section 25 of the
  principal Act, in sub-section (1), for the proviso, the following proviso
  shall be substituted, namely:-- 'Provided that the Central Government may in
  consultation with the Central Board, by notification in the Official Gazette,
  exempt certain categories of industrial plants from the provisions of this
  sub-section.'" No official Maharashtra adoption instrument is archived in
  this dataset; the adoption is only reported in secondary/press material.
verification_status: UNVERIFIED
