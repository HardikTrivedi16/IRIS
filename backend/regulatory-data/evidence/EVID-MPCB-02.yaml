source_id: SRC-002
section_or_clause: "Section 21(1) r/w Section 19(1); MPCB RTI s.4 disclosure"
page: null
excerpt: >
  "no person shall, without the previous consent of the State Board,
  establish or operate any industrial plant in an air pollution control
  area" (s.21(1)); MPCB RTI s.4 disclosure (versions dated 31.03.2026 and
  31.07.2026): "The entire state of Maharashtra has been declared as Air
  Pollution Control Area since 06/11/1996." One 2001 CAG audit report
  instead states "November 1995" for the same declaration — an unresolved
  date discrepancy between two secondary/portal-level sources; MPCB's own
  repeated statement (06/11/1996) is preferred pending the 1996 gazette
  itself, which has not been located.
verification_status: UNVERIFIED
