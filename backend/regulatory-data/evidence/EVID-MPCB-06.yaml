section_or_clause: "Jan Vishwas (Amendment of Provisions) Act, 2023 (18 of 2023), Schedule item 21(A) - substituted s.21(1), Air Act 1981"
page: 30
excerpt: >
  "(1) No person shall establish or operate any industrial plant in an air
  pollution control area unless the previous consent of the State Board has
  been obtained in pursuance of an application made by such person in
  accordance with the provisions of this section: Provided that the Central
  Government may in consultation with the Central Pollution Control Board, by
  notification in the Official Gazette, exempt certain categories of industrial
  plants from the application of the provisions of this sub-section."
  Per the Act's s.1(2) it comes into force on dates to be notified; the
  commencement notification for the Air Act entries was not located.
verification_status: VERIFIED
