requirement_notes: >
  SH-03 (MH_MULTI_SECTOR_REGULATORY_RESEARCH.md §12/H2.1): ONE Requirement,
  TWO Rule Versions. RULE-0007 answers only "is this establishment a
  factory?" (the 20-with-power / 40-without-power OSH Code test) — this is
  VERIFIED_READY_FOR_PROVENANCE per the research pack's own classification.
  RULE-0008 answers the separate question of what licence/plan-approval
  procedure follows, which remains transitional (Maharashtra Factories
  Rules, 1963 machinery) pending Maharashtra's own OSH state rules, still
  DRAFT as of this pass — RULE-0008 must never be promoted merely because
  RULE-0007 promotes; its blocker is a genuine open state-rules question,
  not archival.
