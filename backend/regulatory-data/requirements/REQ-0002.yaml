requirement_notes: >
  Same bridging-population rationale as REQ-0001. Note this Requirement's scope: RF-0002's evidence
  (Air Act, 1981, Section 21(1)) covers "establish or operate" in one sentence, so RULE-0002 (and
  therefore this Requirement) determines a single combined establish/operate applicability question
  for the Air Act. This differs structurally from Task 2's preliminary conceptual model, which
  treats "MPCB CTE" (R05) and "MPCB CTO" (R06/R13) as two separate sequential nodes with an evidenced
  "strongest lifecycle dependency" between them (Task 2 §8). That two-step structure is NOT
  reproduced here for the Air Act, because the actual Phase 3 evidence collected (EVID-MPCB-02) does
  not separately establish a distinct "establish" fact and a distinct "operate" fact the way the
  Water Act evidence (RF-0001, establish-only) does — see the Dependency Review Register
  (`RULE-DEP-REV-0001`) for why no CTE→CTO dependency edge could be authored between REQ-0001 and
  REQ-0002, or within REQ-0002 alone.

wave_1c_note: >
  Wave 1C (2026-09-26): RULE-0002-V2 (DRAFT) models the White-category
  exemption. A prior-EC plant is exempt from consent to ESTABLISH only
  (G.S.R. 702(E)(b)); consent to OPERATE still applies, so this combined
  Requirement remains APPLICABLE for it (meaning consent to operate). The
  Requirement was NOT split: no second Requirement was created. Whether to
  split REQ-0002 into separate CTE and CTO Requirements is left to the human
  reviewer; RULE-0002-V1 is preserved.

batch2_note: >
  Batch 2 (2026-09-26): NOT split into CTE and CTO Requirements. s.21(1) is a single consent
  provision (establish or operate) and G.S.R. 702(E) exempts prior-EC plants only from the
  consent-to-establish component, so the combined APPLICABLE answer is accurate for every case.
  RULE-0002-V2 effective_start_date set to 2024-11-12; candidate for human approval.
