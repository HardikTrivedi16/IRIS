requirement_notes: >
  Same bridging-population rationale as REQ-0001. Task 2 §12 (R10) references a different provision
  — "Rule 70... Form 25 for relevant manufacturing licences and a separate Form 25F pathway for
  Schedule X" — while the actual VERIFIED Phase 3 evidence (EVID-FDA-01) cites Rule 69(1) and Form
  24. This is a genuine, documented discrepancy between Task 2's preliminary/unverified framing and
  the independently verified evidence collected afterward; it is not resolved here (resolving it
  would require new evidence collection, out of scope for this pass) and should not be read as an
  error in either RF-0004 or RULE-0003 — Task 2 was explicitly preliminary and directed the
  discovery, not the final regulatory determination (Phase 3/4's own evidence supersedes it per the
  project's evidence hierarchy). Flagged here so a future phase does not silently assume Task 2's
  Rule 70/Form 25 framing was independently confirmed.

  PHARMA TRANCHE (2026-09-23, MH_MULTI_SECTOR_REGULATORY_RESEARCH.md H1/H2.2/H6 — see
  rule_review_register.yaml RULE-REV-0002): `project.drug_schedule_classification` reshaped from a
  3-value NOT_IN list to the ENUM {NONE, SCHEDULE_C_OR_C1, SCHEDULE_X_ONLY,
  SCHEDULE_C_OR_C1_AND_X}. RULE-0003 (this Requirement's `evaluated_by_rule_id`) is now a coarse
  drug-manufacturing gate (schedule-independent); PH-01 (RULE-0017, ENUM==NONE), PH-02 (RULE-0018,
  ENUM==SCHEDULE_C_OR_C1), and PH-03 (RULE-0019, ENUM==SCHEDULE_X_ONLY or
  SCHEDULE_C_OR_C1_AND_X — KEEP_DRAFT) are new Rules added as `classification_rule_ids` under this
  SAME Requirement — per the research's explicit instruction, they are RULE_VERSION branches of
  REQ-0003, not new Requirements, and REQ-0003 was not duplicated.

  KNOWN LIMITATION (do not silently rely on REQ-0003's top-level `final_state` alone for a
  Schedule-C/C1 or Schedule-X product): `iris_engine.classification.evaluate_classification_group`'s
  combine logic only promotes a classification result into the top-level Decision when
  `evaluated_by_rule_id` (RULE-0003, the coarse gate) is ITSELF already APPLICABLE — which it is,
  for any project that clears the coarse gate, regardless of schedule. So for a genuine
  manufactures_drugs_for_sale_or_distribution==true project, RULE-0003 IS APPLICABLE and the
  classification override correctly surfaces PH-02/PH-03's specific result when relevant (see
  RULE-0017's validation_notes for the full trace). This note exists to record that the fix was
  verified by tracing the actual combine logic, not assumed — see the focused tests added this pass
  (test_pharma_tranche.py) which exercise exactly this path end-to-end.

authority_attribution_note: >
  RESOLVED 2026-09-23. Previously `authority_id` fell back to `AUTH-CDSCO` for lack of a
  Maharashtra-specific state Drugs Control authority record. The normalized research (§13.1) now
  provides one: **AUTH-FDA-MH** (Food and Drug Administration, Maharashtra — Drugs Control/State
  Licensing Authority), created this pass and set as this Requirement's `authority_id`. AUTH-CDSCO
  is retained separately (also created this pass) as the issuing authority of the Central
  instrument (INST-DRUGS-RULES-1945) and for genuinely Central roles (new drugs, imports,
  biologics) — none of which PH-01/02/03/05 invoke.
