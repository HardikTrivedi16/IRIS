requirement_notes: >
  FD-01 (MH_MULTI_SECTOR_REGULATORY_RESEARCH.md §12/H2.2). Modelled as a
  standalone Requirement, not a Rule Version of REQ-0004 (the generic
  industry==FOOD applicability proxy) — H2.2 classifies FD-01/FD-02 as
  their own REQUIREMENT nodes, distinct from REQ-0004 and from the dairy
  pair (RULE-0005/RULE-0006, which remain classification_rule_ids of
  REQ-0004). REQ-0004 itself is unchanged; it continues to answer only the
  coarse industry==FOOD applicability proxy question, not which FSSAI
  licence tier applies — see REQ-0004's own requirement_notes and RULE-0004's
  KEEP disposition. No contract conflict found requiring escalation: the
  repository's existing Requirement/Rule model (one Requirement per
  distinct approval question) accommodates FD-01/FD-02 as siblings of
  REQ-0004 cleanly, exactly as the normalized research pack specifies.

batch2_note: >
  Batch 2 final pass (2026-09-26): RULE-0014-V3 supersedes RULE-0014-V2. This Requirement is the project's
  FSSAI CENTRAL-tier classification for FOOD-industry projects: turnover above Rs. 50 crore under the
  standard bands (general manufacturing, dairy, vegetable oil, slaughter, meat, fish, substances added to
  food) OR an always-Central category (supplements/nutraceuticals, Ayurveda Aahara, proprietary,
  non-specified, radiation processing, 100% EOU/exporter-manufacturer). The title's "Schedule 1 entry V"
  wording is historical; the operative basis is SRC-011/SRC-012. See RULE-REV-0012.
