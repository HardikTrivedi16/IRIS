requirement_notes: >
  SH-04 (MH_MULTI_SECTOR_REGULATORY_RESEARCH.md §12). Fact-triggered,
  applies across all sectors that operate a qualifying boiler. Renewal/
  certificate-lifecycle content lives in REQ-0007 (SH-05), a separate
  Requirement, not a Rule Version of this one — its obligation (event-based
  cessation/renewal) is a distinct continuing duty from initial
  registration, per H2.2's own classification.

