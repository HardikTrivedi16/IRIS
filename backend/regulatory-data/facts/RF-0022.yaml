regulatory_fact_id: RF-0022
statement: >
  Effective 01.04.2026, a food processing unit within the residual/general-
  manufacturing category (the current operative successor to Schedule 1
  entry V — same dairy/vegetable-oil/slaughter/meat-processing/grains-
  cereals-pulses-milling exclusions) with annual turnover more than Rs. 50
  crore requires a Central FSSAI licence, per an FSSAI Order dated
  13.03.2026 that supersedes the prior turnover thresholds/criteria for
  Food Business categorisation. This is the current (turnover-based)
  successor to RF-0011's historical (installed-capacity-based) Central
  criterion — see rule_review_register.yaml RULE-REV-0006 for how the two
  relate; RF-0011 is NOT retracted, it grounds the now-superseded
  RULE-0014-V1.
  Batch 2 final pass (2026-09-26) scope note: the turnover bands apply to general manufacturing and,
  per SRC-012, to dairy, vegetable oil, slaughtering, meat processing, fish and fish products and
  substances added to food under their own rows. Six categories are Central regardless of turnover
  (supplements/nutraceuticals, Ayurveda Aahara, proprietary, non-specified, radiation processing,
  100% EOU/exporter-manufacturer) and grain/cereal/pulse milling units are State regardless of
  turnover (COND-0082). Earlier wording above that lists five exclusions is incomplete.
