regulatory_fact_id: RF-0034
statement: >
  Under the proviso to s.25(1) of the Water Act, 1974 (as substituted by the
  Water Amendment Act, 2024), the Central Government's G.S.R. 703(E) of
  12.11.2024 exempts from s.25(1) (a) industrial plants with pollution index
  score up to 20 listed in its Schedule (White category), on condition that
  the plant informs the State Board in writing, and (b) industrial plants that
  obtained prior environmental clearance under S.O. 1533(E) of 14.09.2006 'in
  respect of previous consent to establish such plant'. The 2024 Amendment Act
  applies in a State other than Himachal Pradesh/Rajasthan/UTs only from that
  State's adoption by resolution; MPCB's own circular of 16.06.2025 handles
  White category units by self-certified consent on its portal.
