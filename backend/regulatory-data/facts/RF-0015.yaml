regulatory_fact_id: RF-0015
statement: >
  An establishment on whose premises 40 or more workers work, or worked on
  any day of the preceding 12 months, in a manufacturing process carried
  on without the aid of power is a "factory" under the OSH Code, 2020
  (s.2(1)(w)(ii)); DISH-Maharashtra's own FAQ states the same 40 for
  Maharashtra (State notification not archived - see RF-0014). Even where
  neither limb is met, State notification powers may extend coverage to
  certain smaller/notified activities regardless of headcount - this must
  be stated as a caveat wherever the FALSE outcome is shown, never
  silently omitted.
