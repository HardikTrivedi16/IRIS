regulatory_fact_id: RF-0024
statement: >
  Effective 01.04.2026, a food processing unit within the same residual/
  general-manufacturing category with annual turnover up to Rs. 1.5 crore
  requires only FSSAI Registration (not a Central or State licence), per
  the same FSSAI Order dated 13.03.2026. No prior Regulatory Fact in this
  dataset covered this band for the entry-V-equivalent category — see
  RULE-REV-0003 for the analogous historical gap that existed for dairy.
