regulatory_fact_id: RF-0020
statement: >
  A manufacturer, packer or importer who pre-packs or imports a commodity for sale, distribution
  or delivery must register with the Director/Controller of Legal
  Metrology within 90 days of commencing pre-packing or importing, fee ₹500
  (Legal Metrology (Packaged Commodities) Rules, 2011, r.27(1)).
evidence_ids: [EVID-LM-01, EVID-LM-02, EVID-LM-03]
