regulatory_fact_id: RF-0030
statement: >
  Under the E-Waste (Management) Rules, 2022 r.3(1)(t), a "producer" is any
  person or entity who manufactures and offers to sell Schedule-I EEE (and
  components/parts) under its own brand; offers to sell under its own brand
  assembled Schedule-I EEE produced by others; offers to sell imported EEE;
  or imports used EEE. A producer must register on the CPCB portal (r.4(1)(b))
  and may not carry on business without registration (r.4(3)). The Rules do
  not apply to micro enterprises (r.2(c)). Whether an item is Schedule-I EEE
  is a legal check captured in the facts, not inferred. (EL-01.)
