regulatory_fact_id: RF-0035
statement: >
  Under the proviso to s.21(1) of the Air Act, 1981 (as substituted by the Jan
  Vishwas Act, 2023), the Central Government's G.S.R. 702(E) of 12.11.2024
  exempts from s.21(1) (a) industrial plants with pollution index score up to
  20 listed in its Schedule (White category), on condition that the plant
  informs the State Board in writing, and (b) industrial plants that obtained
  prior environmental clearance under S.O. 1533(E) of 14.09.2006 'in respect of
  previous consent to establish such plant' - i.e. consent to establish only;
  consent to operate is not exempted by the archived text.
