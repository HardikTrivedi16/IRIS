regulatory_fact_id: RF-0014
statement: >
  An establishment on whose premises 20 or more workers work, or worked
  on any day of the preceding 12 months, in a manufacturing process
  carried on with the aid of power (or ordinarily so carried on) is a
  "factory" under the OSH Code, 2020 (s.2(1)(w)(i)), in force from
  21.11.2025 (S.O. 5321(E)). The Code's proviso lets a worker number that
  a State's own law specified immediately before commencement prevail in
  that State. For Maharashtra, DISH-Maharashtra's own FAQ states the same
  20 / 40 numbers; the Factories (Maharashtra Amendment) Act, 2015 only
  empowers the State to specify numbers up to 20 / 40, and the State
  notification itself is NOT archived, so the State-number proviso is
  treated as not changing the threshold on the strength of that FAQ
  alone. Separately, for Chapter II (registration) s.2(1)(v)(iii) treats a
  factory with ten or more workers as an establishment notwithstanding
  the 20/40 threshold - this Fact answers factory status only.
