regulatory_fact_id: RF-0028
statement: >
  A drug manufacturing licence (Forms 25, 25A, 25B, 25F, 28, 28B and 28D
  per Drugs Rules 72, 73AA and 77) remains valid perpetually unless sooner suspended or cancelled,
  subject to (a) compliance/GMP assessment not less than once every
  three years or as needed on a risk-based approach, and (b) a retention
  fee payable before the expiry of every succeeding five years from the
  date of issue — per the G.S.R. 1337(E) series amendment (2017) to the
  Drugs Rules, 1945. This is a continuing retention-fee obligation
  attaching to licence holders, not periodic renewal metadata — non-
  payment carries its own suspension/cancellation consequence. (PH-05.)
