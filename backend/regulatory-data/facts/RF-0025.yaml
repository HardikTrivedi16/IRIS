regulatory_fact_id: RF-0025
statement: >
  A project that manufactures drugs for sale or distribution (excluding
  repacking), where the drug's schedule classification is NONE (outside
  Schedule C, Schedule C(1), and Schedule X), must apply for a
  manufacturing licence in Form 24 (Rule 69(1)(c), Drugs Rules, 1945) to
  the State Licensing Authority (FDA Maharashtra); the licence is issued
  in Form 25. (PH-01.)
