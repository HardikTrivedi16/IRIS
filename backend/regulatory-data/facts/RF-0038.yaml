regulatory_fact_id: RF-0038
statement: >
  The E-Waste (Management) Rules, 2022 apply to manufacturers, producers,
  refurbishers, dismantlers and recyclers dealing in Schedule-I EEE but do not
  apply to (among others) a micro enterprise as defined in the MSMED Act, 2006
  (r.2(c)).
