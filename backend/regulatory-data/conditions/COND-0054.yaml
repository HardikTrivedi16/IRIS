description: >
  True if drug_schedule_classification is SCHEDULE_X_ONLY OR
  SCHEDULE_C_OR_C1_AND_X — i.e. the product involves Schedule X in
  either its pure or C/C1-combined form. The two values are mutually
  exclusive (an ENUM fact takes exactly one value), so this OR never
  double-counts.

