description: >
  REQ-0003 coarse gate (RESHAPED 2026-09-23 — see rule_review_register.yaml
  RULE-REV-0002): manufactures_drugs_for_sale_or_distribution == true AND
  pharma_activity_type NOT_IN [REPACKING]. True whenever SOME drug-
  manufacturing-licence pathway could apply, independent of which drug
  schedule the product falls in — the schedule-specific branch (PH-01
  NONE / PH-02 SCHEDULE_C_OR_C1 / PH-03 Schedule-X-related) is a separate
  AND-ed leaf on top of this same gate (COND-0049/COND-0051/COND-0055),
  exactly mirroring how COND-0032 is a shared subsector guard reused
  beneath FD-01/FD-02's separate capacity leaves.

normalization_notes: >
  PRE-2026-09-23 this condition directly tested `drug_schedule_classification
  NOT_IN ["SCHEDULE_C","SCHEDULE_C1","SCHEDULE_X"]` — a 3-value NOT_IN-list
  that could not express the Schedule-C∩X combined case and had no
  positive branch for what DOES govern the excluded schedules (RULE-REV-
  0002). RULE-0003-V1 was never ACTIVE (still DRAFT, confidence
  REQUIRES_REVIEW), so this is a genuine in-place CORRECTION per the
  normalized research's H1 disposition ("REQ-0003 + COND-0003: CORRECT"),
  not a change to any legally-authoritative historical position.
  RULE-0003 itself is repurposed from "the Form-24/NONE-schedule pathway"
  to this coarse gate — PH-01 (Form 24/25, NONE) is now its own new Rule
  (RULE-0017) so that REQ-0003's `classification_rule_ids` mechanism can
  correctly surface PH-01/02/03's actual result to the top-level Decision
  (iris_engine.classification's combine logic only promotes a
  classification result to the top-level final_state when the
  evaluated_by_rule_id rule is ITSELF already APPLICABLE — a schedule-
  specific rule sitting directly on REQ-0003 would silently produce the
  wrong top-level answer for every non-NONE schedule value; see
  RULE-0017/0018/0019's own validation_notes and RULE-REV-0002).
