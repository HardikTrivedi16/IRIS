description: >
  SH-03 root: the OSH Code, 2020 "factory" test — (worker_count >= 20 AND
  uses_power == true) OR (worker_count >= 40 AND uses_power == false).
  Shared by both of SH-03's Rule Versions (RULE-0007-V1 applicability and
  RULE-0008-V1 licence-detail — see RULE-0008's own notes on why it reuses
  this same root rather than a distinct one).

normalization_notes: >
  Three-valued OR: a known-TRUE branch is sufficient even if the other
  branch's facts are UNKNOWN; both branches UNKNOWN (or one FALSE/one
  UNKNOWN) resolves UNKNOWN, never FALSE. FALSE only when both branches are
  definitely FALSE, at which point the FALSE-branch caveat (State
  notification powers may extend coverage to certain smaller/notified
  activities regardless of headcount — RF-0015) must still be shown; that
  caveat lives in RULE-0007-V1's false_outcome text, not in this condition.
