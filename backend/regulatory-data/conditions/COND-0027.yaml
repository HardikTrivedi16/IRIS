description: >
  True if the project's MSME classification is not Micro or Small (i.e.
  Medium, Not-MSME, or explicitly Unknown-tolerant per engine UNKNOWN
  policy) — the enterprise-size leg of the MSE exemption test (S.O.
  3289(E), Para 1.0(v)).

normalization_notes: >
  Never inferred from project size/scale — project.msme_classification is
  the statutory MSMED status, a distinct user-declared fact (per §7 of the
  implementation brief). ORed with COND-0026 as SH-07's composite root,
  COND-0028.
