condition_id: COND-0039
predicate_type: THRESHOLD_COMPARISON

target_variable_key: project.annual_turnover_inr
operator: ">"
comparison_value: 500000000
unit: INR

child_condition_ids: []
unresolved_behavior: UNKNOWN

evidence_ids:
  - EVID-FSS-07
  - EVID-FSS-08

grounding_regulatory_fact_ids:
  - RF-0022

description: >
  True if annual turnover is strictly more than Rs. 50 crore
  (500,000,000 INR) — the current (post-01.04.2026) Central-licence
  turnover threshold for the residual/general-manufacturing category,
  per FSSAI's Order dated 13.03.2026 (SRC-011) and corroborating FoSCoS
  table (SRC-012).

normalization_notes: >
  comparison_value is stored as a plain integer INR amount
  (50 crore = 50 * 10,000,000 = 500,000,000), not a fractional crore
  value — matches this dataset's existing integer-comparison convention
  (see COND-0001 etc.) and avoids floating-point crore arithmetic. ANDed
  with COND-0032 (unchanged subsector guard) as this rule's composite
  root, COND-0040. This is the successor leaf to COND-0031 (the
  historical installed-capacity ">2 MT/day" test now superseded — see
  RULE-0014-V1/RULE-0014-V2 and rule_review_register.yaml RULE-REV-0006).
